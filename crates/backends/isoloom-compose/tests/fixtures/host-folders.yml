# A desk mounting three folders of the computer that runs the lab: one of the project, one of
# the home folder (read-only), one absolute.
version: 1
name: shared-desk
networks:
  lan: { cidr: 10.30.0.0/24 }
machines:
  desk:
    os: debian@12
    networks: { lan: 10 }
    host_folders:
      - { from: shared, path: /srv/shared }
      - { from: "~/notes", path: /home/notes, read_only: true }
      - { from: /srv/drop, path: /srv/drop }
