# A machine with its own process: a command, a working directory, a `setup` script and a
# healthcheck beside its port probe.
version: 1
name: own-process
inputs: { FLAG: { sensitive: false } }
networks: { lan: { cidr: 10.9.0.0/24 } }
machines:
  web:
    networks: { lan: 10 }
    environment: { FLAG: { input: FLAG } }
    ports: { site: 8000 }
    app: { image: "python:3-alpine" }
    command: { run: [python3, -m, http.server, "8000"], cwd: /srv }
    setup: [flag.sh]
    healthcheck: { test: "test -s /srv/flag && echo $FLAG", interval: 2s, retries: 30 }
  api:
    networks: { lan: 11 }
    ports: { api: 9000 }
    app: { image: "python:3-alpine" }
    command: python3 -m http.server 9000
    healthcheck: { http: { port: 9000, path: /health }, start_period: 1m }
