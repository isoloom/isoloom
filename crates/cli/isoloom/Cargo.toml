[package]
name = "isoloom"
description = "Describe an environment once (machines, networks, services), and get each tool's own files to run it: Compose, Kubernetes, Vagrant, Terraform, Ansible."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/isoloom"
keywords = ["isoloom", "iac", "cli", "infrastructure", "converter"]
categories = ["command-line-utilities", "config"]
exclude = ["tests/"]
publish = true

[[bin]]
name = "isoloom"
path = "src/main.rs"

# `cargo binstall isoloom`: the release archives the release workflow publishes.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/isoloom-{ target }{ archive-suffix }"
bin-dir = "isoloom-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
isoloom-spec.workspace = true
isoloom-targets.workspace = true
isoloom-import.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
