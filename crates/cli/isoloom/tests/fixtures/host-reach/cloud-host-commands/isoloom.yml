# Cloud services (`cloud:`), which Isoloom 3.0 refuses: the target is removed.
version: 1
name: cloud-host-commands
cloud:
  provider: aws
  terraform: infra
  env: { LD_PRELOAD: /tmp/x.so, TF_CLI_ARGS_apply: "-parallelism=1", TF_CLI_CONFIG_FILE: infra/other.tfrc }
  requires: ["docker run --rm -v /:/host alpine true", "python3.12 -c print(1)"]
