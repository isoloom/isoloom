os: ubuntu@22.04
app:
  steps:
  - command: |
      set -e
      mkdir -p /var/lib/isoloom/dockerfile
      if command -v systemctl >/dev/null; then
        systemctl list-unit-files --state=enabled --type=service --no-legend | awk '{print $1}' | sort > /var/lib/isoloom/dockerfile/units-before
      elif command -v rc-update >/dev/null; then
        rc-update show default | awk '{print $1}' | sort > /var/lib/isoloom/dockerfile/units-before
      fi
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/001
    creates: /var/lib/isoloom/dockerfile/001
  - command: |
      set -e
      d=/usr/local/lib/isoloom/shims
      mkdir -p "$d"
      cat > "$d/useradd" <<'SHIM'
      #!/bin/sh
      for a; do [ "${prev:-}" = -u ] || [ "${prev:-}" = --uid ] && id="$a"; prev="$a"; done
      if [ -n "${id:-}" ] && getent passwd "$id" >/dev/null; then exec /usr/sbin/useradd -o "$@"; fi
      exec /usr/sbin/useradd "$@"
      SHIM
      cat > "$d/groupadd" <<'SHIM'
      #!/bin/sh
      for a; do [ "${prev:-}" = -g ] || [ "${prev:-}" = --gid ] && id="$a"; prev="$a"; done
      if [ -n "${id:-}" ] && getent group "$id" >/dev/null; then exec /usr/sbin/groupadd -o "$@"; fi
      exec /usr/sbin/groupadd "$@"
      SHIM
      chmod 755 "$d/useradd" "$d/groupadd"
      if command -v apk >/dev/null; then
        for tool in adduser addgroup; do
          cat > "$d/$tool" <<SHIM
      #!/bin/sh
      flag=-u; [ $tool = addgroup ] && flag=-g
      db=passwd; [ $tool = addgroup ] && db=group
      out=; skip=
      for a; do
        if [ -n "\$skip" ]; then skip=; getent "\$db" "\$a" >/dev/null || out="\$out \$flag \$a"; continue; fi
        if [ "\$a" = "\$flag" ]; then skip=1; continue; fi
        out="\$out \$a"
      done
      exec /bin/busybox $tool \$out
      SHIM
          chmod 755 "$d/$tool"
        done
      fi
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/002
    creates: /var/lib/isoloom/dockerfile/002
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      apt-get update && apt-get install -y --no-install-recommends gcc make libc6-dev && rm -rf /var/lib/apt/lists/*
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/003
    creates: /var/lib/isoloom/dockerfile/003
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      isoloom_copy_into() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; mkdir -p "$2"; if [ -d "$1" ]; then cp -a "$1"/. "$2"/; else cp -a "$1" "$2"/; fi; }
      isoloom_copy_to() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; if [ -d "$1" ]; then mkdir -p "$2"; cp -a "$1"/. "$2"/; else mkdir -p "$(dirname "$2")"; cp -a "$1" "$2"; fi; }
      isoloom_untar() { mkdir -p "$2"; tar -xf "$1" -C "$2"; }
      isoloom_fetch() { command -v curl >/dev/null || { apt-get update && apt-get install -y curl; } || apk add curl || dnf install -y curl; mkdir -p "$(dirname "$2")"; curl -fsSL "$1" -o "$2"; }
      dest=/src
      for s in /opt/isoloom/build/kctf-challenge/app/challenge; do isoloom_copy_into "$s" "$dest"; done
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/004
    creates: /var/lib/isoloom/dockerfile/004
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      make -C /src chal
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/005
    creates: /var/lib/isoloom/dockerfile/005
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      /usr/sbin/useradd --no-create-home -u 1000 user
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/006
    creates: /var/lib/isoloom/dockerfile/006
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      isoloom_copy_into() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; mkdir -p "$2"; if [ -d "$1" ]; then cp -a "$1"/. "$2"/; else cp -a "$1" "$2"/; fi; }
      isoloom_copy_to() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; if [ -d "$1" ]; then mkdir -p "$2"; cp -a "$1"/. "$2"/; else mkdir -p "$(dirname "$2")"; cp -a "$1" "$2"; fi; }
      isoloom_untar() { mkdir -p "$2"; tar -xf "$1" -C "$2"; }
      isoloom_fetch() { command -v curl >/dev/null || { apt-get update && apt-get install -y curl; } || apk add curl || dnf install -y curl; mkdir -p "$(dirname "$2")"; curl -fsSL "$1" -o "$2"; }
      dest=/
      for s in /opt/isoloom/build/kctf-challenge/app/challenge/flag; do isoloom_copy_into "$s" "$dest"; done
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/007
    creates: /var/lib/isoloom/dockerfile/007
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      isoloom_copy_into() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; mkdir -p "$2"; if [ -d "$1" ]; then cp -a "$1"/. "$2"/; else cp -a "$1" "$2"/; fi; }
      isoloom_copy_to() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; if [ -d "$1" ]; then mkdir -p "$2"; cp -a "$1"/. "$2"/; else mkdir -p "$(dirname "$2")"; cp -a "$1" "$2"; fi; }
      isoloom_untar() { mkdir -p "$2"; tar -xf "$1" -C "$2"; }
      isoloom_fetch() { command -v curl >/dev/null || { apt-get update && apt-get install -y curl; } || apk add curl || dnf install -y curl; mkdir -p "$(dirname "$2")"; curl -fsSL "$1" -o "$2"; }
      dest=/home/user
      for s in /src/chal; do isoloom_copy_into "$s" "$dest"; done
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/008
    creates: /var/lib/isoloom/dockerfile/008
  - command: |
      set -eu
      # kCTF's challenge base on a VM (the owner's decision: the VM is the jail, no nsjail): socat, and
      # the base's commands as shims. `nsjail ... -- <command>` runs the command as the challenge's
      # `user` in its home; `kctf_pow` runs its command (no proof of work); `kctf_setup` has nothing to
      # set up.
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends socat util-linux
      cat > /usr/local/bin/nsjail <<'SHIM'
      #!/bin/sh
      # kCTF's jail, on a VM that is the jail: the command after `--`, as the challenge's user.
      while [ "$#" -gt 0 ] && [ "$1" != "--" ]; do shift; done
      [ "$#" -gt 0 ] && shift
      cd /home/user 2>/dev/null || cd /
      if id user >/dev/null 2>&1; then
        exec setpriv --reuid "$(id -u user)" --regid "$(id -g user)" --init-groups -- "$@"
      fi
      exec setpriv --reuid 1000 --regid 1000 --clear-groups -- "$@"
      SHIM
      printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/kctf_pow
      printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/kctf_setup
      chmod 755 /usr/local/bin/nsjail /usr/local/bin/kctf_pow /usr/local/bin/kctf_setup
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/009
    creates: /var/lib/isoloom/dockerfile/009
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      isoloom_copy_into() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; mkdir -p "$2"; if [ -d "$1" ]; then cp -a "$1"/. "$2"/; else cp -a "$1" "$2"/; fi; }
      isoloom_copy_to() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; if [ -d "$1" ]; then mkdir -p "$2"; cp -a "$1"/. "$2"/; else mkdir -p "$(dirname "$2")"; cp -a "$1" "$2"; fi; }
      isoloom_untar() { mkdir -p "$2"; tar -xf "$1" -C "$2"; }
      isoloom_fetch() { command -v curl >/dev/null || { apt-get update && apt-get install -y curl; } || apk add curl || dnf install -y curl; mkdir -p "$(dirname "$2")"; curl -fsSL "$1" -o "$2"; }
      dest=/chroot
      : a stage's whole filesystem into kCTF's chroot: the VM itself is the jail
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/010
    creates: /var/lib/isoloom/dockerfile/010
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      isoloom_copy_into() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; mkdir -p "$2"; if [ -d "$1" ]; then cp -a "$1"/. "$2"/; else cp -a "$1" "$2"/; fi; }
      isoloom_copy_to() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; if [ -d "$1" ]; then mkdir -p "$2"; cp -a "$1"/. "$2"/; else mkdir -p "$(dirname "$2")"; cp -a "$1" "$2"; fi; }
      isoloom_untar() { mkdir -p "$2"; tar -xf "$1" -C "$2"; }
      isoloom_fetch() { command -v curl >/dev/null || { apt-get update && apt-get install -y curl; } || apk add curl || dnf install -y curl; mkdir -p "$(dirname "$2")"; curl -fsSL "$1" -o "$2"; }
      dest=/home/user
      for s in /opt/isoloom/build/kctf-challenge/app/challenge/nsjail.cfg; do isoloom_copy_into "$s" "$dest"; done
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/011
    creates: /var/lib/isoloom/dockerfile/011
  - command: |
      set -e
      keep='^(ssh|sshd|systemd-|getty|serial-getty|cloud-|qemu-guest-agent|vbox|open-vm-tools|vmtoolsd|networking|rsyslog|cron|chrony|isoloom)'
      if command -v systemctl >/dev/null; then
        systemctl list-unit-files --state=enabled --type=service --no-legend | awk '{print $1}' | sort > /var/lib/isoloom/dockerfile/units-after
        for u in $(comm -13 /var/lib/isoloom/dockerfile/units-before /var/lib/isoloom/dockerfile/units-after | grep -Ev "$keep" || true); do
          systemctl disable --now "$u" || true
        done
      elif command -v rc-update >/dev/null; then
        rc-update show default | awk '{print $1}' | sort > /var/lib/isoloom/dockerfile/units-after
        for u in $(comm -13 /var/lib/isoloom/dockerfile/units-before /var/lib/isoloom/dockerfile/units-after | grep -Ev "$keep" || true); do
          rc-service "$u" stop || true
          rc-update del "$u" default || true
        done
      fi
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/012
    creates: /var/lib/isoloom/dockerfile/012
  - command: |
      set -e
      mkdir -p /usr/local/lib/isoloom
      printf %s  | base64 -d > /usr/local/lib/isoloom/app-start
      chmod 755 /usr/local/lib/isoloom/app-start
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/013
    creates: /var/lib/isoloom/dockerfile/013
  - service:
      name: isoloom-app
      run:
      - /usr/local/lib/isoloom/app-start
      cwd: /
