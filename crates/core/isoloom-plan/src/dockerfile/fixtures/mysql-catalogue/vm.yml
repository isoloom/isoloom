os: debian@11
app:
  steps:
  - command: |
      set -e
      mkdir -p /var/lib/isoloom/dockerfile
      if command -v systemctl >/dev/null; then
        systemctl list-unit-files --state=enabled --type=service --no-legend | awk '{print $1}' | sort > /var/lib/isoloom/dockerfile/units-before
      elif command -v rc-update >/dev/null; then
        rc-update show default | awk '{print $1}' | sort > /var/lib/isoloom/dockerfile/units-before
      fi
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/001
    creates: /var/lib/isoloom/dockerfile/001
  - command: |
      set -e
      d=/usr/local/lib/isoloom/shims
      mkdir -p "$d"
      cat > "$d/useradd" <<'SHIM'
      #!/bin/sh
      for a; do [ "${prev:-}" = -u ] || [ "${prev:-}" = --uid ] && id="$a"; prev="$a"; done
      if [ -n "${id:-}" ] && getent passwd "$id" >/dev/null; then exec /usr/sbin/useradd -o "$@"; fi
      exec /usr/sbin/useradd "$@"
      SHIM
      cat > "$d/groupadd" <<'SHIM'
      #!/bin/sh
      for a; do [ "${prev:-}" = -g ] || [ "${prev:-}" = --gid ] && id="$a"; prev="$a"; done
      if [ -n "${id:-}" ] && getent group "$id" >/dev/null; then exec /usr/sbin/groupadd -o "$@"; fi
      exec /usr/sbin/groupadd "$@"
      SHIM
      chmod 755 "$d/useradd" "$d/groupadd"
      if command -v apk >/dev/null; then
        for tool in adduser addgroup; do
          cat > "$d/$tool" <<SHIM
      #!/bin/sh
      flag=-u; [ $tool = addgroup ] && flag=-g
      db=passwd; [ $tool = addgroup ] && db=group
      out=; skip=
      for a; do
        if [ -n "\$skip" ]; then skip=; getent "\$db" "\$a" >/dev/null || out="\$out \$flag \$a"; continue; fi
        if [ "\$a" = "\$flag" ]; then skip=1; continue; fi
        out="\$out \$a"
      done
      exec /bin/busybox $tool \$out
      SHIM
          chmod 755 "$d/$tool"
        done
      fi
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/002
    creates: /var/lib/isoloom/dockerfile/002
  - catalogue: mysql@5.7.44 on debian@11
  - command: |
      set -e
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      export MYSQL_ROOT_PASSWORD=trading_platform
      export MYSQL_DATABASE=database
      export PATH="/usr/local/lib/isoloom/shims:$PATH"
      mkdir -p / && cd /
      isoloom_copy_into() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; [ "$1" -ef "$2/${1##*/}" ] && return 0; mkdir -p "$2"; if [ -d "$1" ]; then cp -a "$1"/. "$2"/; else cp -a "$1" "$2"/; fi; }
      isoloom_copy_to() { [ -e "$1" ] || { echo "missing: $1" >&2; exit 1; }; [ "$1" -ef "$2" ] && return 0; if [ -d "$1" ]; then mkdir -p "$2"; cp -a "$1"/. "$2"/; else mkdir -p "$(dirname "$2")"; cp -a "$1" "$2"; fi; }
      isoloom_untar() { mkdir -p "$2"; tar -xf "$1" -C "$2"; }
      isoloom_fetch() { command -v curl >/dev/null || { apt-get update && apt-get install -y curl; } || apk add curl || dnf install -y curl; mkdir -p "$(dirname "$2")"; curl -fsSL "$1" -o "$2"; }
      dest=/docker-entrypoint-initdb.d
      for s in /opt/isoloom/build/mysql-catalogue/init.sql; do isoloom_copy_into "$s" "$dest"; done
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/003
    creates: /var/lib/isoloom/dockerfile/003
  - command: |
      set -e
      keep='^(ssh|sshd|systemd-|getty|serial-getty|cloud-|qemu-guest-agent|vbox|open-vm-tools|vmtoolsd|networking|rsyslog|cron|chrony|isoloom|mysql)'
      if command -v systemctl >/dev/null; then
        systemctl list-unit-files --state=enabled --type=service --no-legend | awk '{print $1}' | sort > /var/lib/isoloom/dockerfile/units-after
        for u in $(comm -13 /var/lib/isoloom/dockerfile/units-before /var/lib/isoloom/dockerfile/units-after | grep -Ev "$keep" || true); do
          systemctl disable --now "$u" || true
        done
      elif command -v rc-update >/dev/null; then
        rc-update show default | awk '{print $1}' | sort > /var/lib/isoloom/dockerfile/units-after
        for u in $(comm -13 /var/lib/isoloom/dockerfile/units-before /var/lib/isoloom/dockerfile/units-after | grep -Ev "$keep" || true); do
          rc-service "$u" stop || true
          rc-update del "$u" default || true
        done
      fi
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/004
    creates: /var/lib/isoloom/dockerfile/004
  - command: |
      set -e
      mkdir -p /etc/isoloom
      printf %s UEFUSD0vdXNyL2xvY2FsL3NiaW46L3Vzci9sb2NhbC9iaW46L3Vzci9zYmluOi91c3IvYmluOi9zYmluOi9iaW4KTVlTUUxfUk9PVF9QQVNTV09SRD10cmFkaW5nX3BsYXRmb3JtCk1ZU1FMX0RBVEFCQVNFPWRhdGFiYXNlCg== | base64 -d > /etc/isoloom/image.env
      chmod 644 /etc/isoloom/image.env
      mkdir -p /var/lib/isoloom/dockerfile && touch /var/lib/isoloom/dockerfile/005
    creates: /var/lib/isoloom/dockerfile/005
