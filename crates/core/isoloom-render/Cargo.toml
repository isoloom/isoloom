[package]
name = "isoloom-render"
description = "What every Isoloom backend renders with: the backend port, the shared builders (PowerShell, Dockerfile, the Ansible inventory), a VM's set-up steps, the network pieces and the containers' shared parts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/isoloom-render"
keywords = ["isoloom", "render", "iac", "templates"]
categories = ["config", "template-engine"]
exclude = ["tests/"]
publish = true

[dependencies]
isoloom-spec.workspace = true
isoloom-plan.workspace = true
isoloom-manifest.workspace = true
serde_json.workspace = true
indexmap.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The cloud-init carrier compresses a recipe's script for `write_files` (`encoding: gz+b64`).
flate2.workspace = true

[features]
# Builders for the tests of the crates above (a dev-dependency turns it on): not a backend's API.
test-support = []

[dev-dependencies]
proptest.workspace = true
serde_yaml_ng.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
