[package]
name = "isoloom-wasm"
description = "Isoloom's topology compiler and targets in WebAssembly, for a topology editor: a drawn network becomes an Isoloom spec, every target's files and the downloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/isoloom-wasm"
readme = "README.md"
keywords = ["isoloom", "wasm", "network", "topology"]
categories = ["wasm", "network-programming"]
exclude = ["tests/"]
publish = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
isoloom-plan.workspace = true
isoloom-spec.workspace = true
isoloom-targets.workspace = true
isoloom-topology.workspace = true
indexmap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
zip.workspace = true

[dev-dependencies]
# The generated Compose file and the spec, read back by path.
serde_yaml_ng.workspace = true
wasm-bindgen-test.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
