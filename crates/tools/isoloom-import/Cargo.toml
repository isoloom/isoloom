[package]
name = "isoloom-import"
description = "Drafting an Isoloom spec from Compose, Vagrant and Terraform files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/isoloom-import"
keywords = ["isoloom", "import", "iac", "reverse"]
categories = ["config", "parser-implementations"]
exclude = ["tests/"]
publish = true

[dependencies]
thiserror.workspace = true
isoloom-spec.workspace = true
hcl.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
indexmap.workspace = true

[dev-dependencies]
# The drafts are checked as `isoloom validate` checks a spec: parsed, then lowered per target.
isoloom-plan.workspace = true
proptest.workspace = true

[lints]
workspace = true
