# typos (CI's `typos` job): words that are right here although they look like misspellings.

[default.extend-words]
# Azure VM sizes (Standard_D2als_v6).
als = "als"
# The Rust crate `flate2`, named in the plan.
flate = "flate"
# The NFS server's command.
exportfs = "exportfs"
# Misspelled keys on purpose: the tests check they are refused.
provder = "provder"
targt = "targt"

[default]
# Commit hashes and agent ids (hex, 7 to 40 characters) in the plan's notes are identifiers, not words.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]
