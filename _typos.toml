# typos (CI's `typos` job): words that are right here although they look like misspellings.

[files]
# Upstream resource and setting lists, copied as the providers spell them.
extend-exclude = ["crates/isoloom-coverage/coverage/"]

[default.extend-words]
# Azure VM sizes (Standard_D2als_v6).
als = "als"
# The NFS server's command.
exportfs = "exportfs"
# Misspelled keys on purpose: the tests check they are refused.
provder = "provder"
targt = "targt"
# Puppet's fact tool, a Vagrant provisioner option.
facter = "facter"
# Cloud services as the providers name their resource types (Linode Kubernetes Engine, Oracle's
# Web Application Acceleration and Security and Content Management, Azure HDInsight and AKS).
lke = "lke"
waas = "waas"
hdinsight = "hdinsight"
oce = "oce"
aks = "aks"
