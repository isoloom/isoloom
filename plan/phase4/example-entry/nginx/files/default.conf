# SPDX-License-Identifier: Apache-2.0
# Written by Isoloom from the catalogue's nginx entry, the same in every form. Isoloom renders
# the {{ … }} placeholders at generation; nginx's own $variables stay as they are.
# `with: { config: <file> }` puts a server block of your own in this file's place.
server {
    listen      {{ with.port }};
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html index.htm index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP through a php-fpm machine, when `with.php_fpm` is set (files/php.conf).
    include /etc/nginx/isoloom.d/*.conf;
}
