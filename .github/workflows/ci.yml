name: CI

# Every push to main and every pull request: formatting, clippy and the tests on Linux, macOS and
# Windows, the quality ratchet, the API docs, the supply chain (cargo-deny, unused dependencies),
# spelling, the links between the docs, SemVer against the last release, the declared minimum
# Rust, deterministic generation, the generated Terraform validated and its modules' tests, and
# every target's generated files checked by their validators (never run). The release gate (gate.yml) runs the core of it again on the tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain (its channel, rustfmt and clippy) is pinned by rust-toolchain.toml.
      - run: rustup toolchain install --profile minimal
      - run: cargo fmt --all --check

  # macOS and Windows binaries are released (release.yml), and the CLI has Windows-only code.
  test:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so a pull request can't seed what main builds with.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The engineering-standard ratchet (clean-code counts per crate against xtask/baselines/quality-baseline.json),
  # the fuzz targets' build, the API docs, and every example validating.
  quality:
    name: Quality ratchet, API docs and examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The ratchet counts what cargo-machete reports, so it needs it installed.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      - run: cargo run -p xtask --locked -- quality
      # The generated files (docs/spec.md, docs/matrix.md, docs/reference/cli.md, schemas/) are
      # current; a stale one fails naming the command that regenerates them.
      - run: .githooks/regenerate --check
      # The fuzz targets (a workspace of their own, outside the others' builds) still build
      # against the crates' public items, formatted and lint-clean.
      - run: cargo run -p xtask --locked -- fuzz --check
      # The API docs build without a warning (broken intra-doc links, bare URLs).
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Every example validates
        run: |
          set -euo pipefail
          cargo build -q --locked -p isoloom
          for e in examples/*/; do
            target/debug/isoloom validate "$e" --skip-files
            target/debug/isoloom targets "$e"
          done

  # The locked dependencies (deny.toml): known vulnerabilities (RustSec), licences on the
  # allow-list, banned crates, and crates.io as the only source.
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Every declared dependency is used.
  machete:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  # Spelling, in code and docs (.typos.toml lists the words that are right here).
  hooks:
    name: Git hooks
    # The hooks (.githooks/, .github/CONTRIBUTING.md "Git hooks"): shellcheck over them, then their
    # test in a throwaway repository, with the gitleaks the pre-push runs.
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned release tarball, its sha256 checked before it runs (from the release's
      # gitleaks_<version>_checksums.txt). Bump the version and the checksum together.
      - name: gitleaks
        run: |
          tarball="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: shellcheck -x .githooks/* scripts/setup-hooks.sh
      - run: .githooks/test.sh

  typos:
    name: Spelling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  # Every link between the Markdown pages reaches a file (offline: no request leaves the runner).
  # The docs test (`cargo test -p isoloom-spec --test docs`) checks the headings links point at.
  links:
    name: Links between the docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            README.md CHANGELOG.md ARCHITECTURE.md '.github/*.md' 'docs/**/*.md'
          fail: true
          jobSummary: true

  # The supported library API (docs/reference/policies.md: isoloom-spec and isoloom-targets),
  # compared by cargo-semver-checks with each crate's latest version on
  # crates.io. The other published crates are building blocks whose API is not a promise. The release type comes from the workspace version: when it is still the
  # published one, the changes are checked as a patch, so a breaking change fails until the version
  # is raised on purpose. One exception, decided for the release after 1.x: while crates.io's
  # latest is a 1.x, the unreleased changes are checked as the 2.0.0 major they are (they remove
  # public API). Once 2.0.0 is published the exception no longer matches and the rule is strict.
  semver:
    name: SemVer against the last release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Release type
        id: release
        run: |
          set -euo pipefail
          published="$(curl -fsS -A "isoloom-ci (https://github.com/isoloom/isoloom)" \
            https://crates.io/api/v1/crates/isoloom-spec | jq -r .crate.max_stable_version)"
          echo "Latest isoloom-spec on crates.io: ${published}"
          case "$published" in
            1.*) echo "args=--release-type major" >> "$GITHUB_OUTPUT" ;;
            *) echo "args=" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: cargo semver-checks
        env:
          RELEASE_ARGS: ${{ steps.release.outputs.args }}
        run: |
          set -euo pipefail
          packages=()
          for crate in isoloom-spec isoloom-targets; do
            packages+=(-p "$crate")
          done
          # shellcheck disable=SC2086 # RELEASE_ARGS is empty or one flag and its value.
          cargo semver-checks "${packages[@]}" $RELEASE_ARGS

  # The published crates build with their declared rust-version (1.88, Cargo.toml). `+1.88`
  # overrides the rust-toolchain.toml pin for this check only (without it the pinned toolchain
  # would build, and the job would prove nothing). The development tasks (xtask, xtask-quality)
  # are not published and build with the pinned toolchain only.
  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.88 check --workspace --exclude xtask --exclude xtask-quality --all-targets --locked

  # Generation is deterministic: every example rendered twice in one process (the test), then
  # generated twice by the command line in the same folder, gives the same files.
  determinism:
    name: Deterministic generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p isoloom-targets --test targets determinism
      - name: The command line, twice
        run: |
          set -euo pipefail
          cargo build -q --locked -p isoloom
          for e in examples/*/; do
            n=$(basename "$e")
            for run in 1 2; do
              rm -rf "$e.isoloom"
              target/debug/isoloom generate "$e" > /dev/null
              mkdir -p "$RUNNER_TEMP/$run/$n"
              cp -R "$e.isoloom" "$RUNNER_TEMP/$run/$n/"
            done
          done
          diff -r "$RUNNER_TEMP/1" "$RUNNER_TEMP/2"

  # The topology editor's engine (isoloom-wasm) builds for the browser, and its exports work as
  # JavaScript calls them.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-pack uses a wasm-bindgen on PATH when its version is the one Cargo.lock locks, so
      # both come from install-action, which checks each download's SHA-256.
      - name: wasm-bindgen version (from Cargo.lock)
        id: bindgen
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.13.1,wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - run: cargo run -p xtask --locked -- wasm
      # The exports as JavaScript calls them (wasm-bindgen-test, on Node).
      - run: wasm-pack test --node crates/frontends/isoloom-wasm

  # The generated Terraform (Proxmox, ESXi, cloud-docker, cloud-vm) is valid for its providers,
  # with the latest Terraform.
  terraform:
    name: Terraform validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate every example (the targets each can be generated for)
        run: |
          set -euo pipefail
          cargo build -q --locked -p isoloom
          for e in examples/*/; do target/debug/isoloom generate "$e" > /dev/null; done
      - name: Validate
        run: |
          set -euo pipefail
          shopt -s nullglob
          validate() {
            echo "== $1"
            terraform -chdir="$1" init -backend=false -input=false >/dev/null
            terraform -chdir="$1" validate
          }
          for d in examples/*/.isoloom/proxmox examples/*/.isoloom/esxi examples/*/.isoloom/cloud-docker/* examples/*/.isoloom/cloud-vm/*; do
            validate "$d"
          done

  # The cloud and server modules' logic proven without a cloud (`cargo xtask tf-test`): every
  # provider mocked, every run a plan, in the pinned validator image. Its expectations
  # (tests/terraform/) break unseen otherwise.
  tf-test:
    name: Terraform module tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p xtask --locked -- tf-test

  # The Windows executable as the release builds it (release.yml: the C runtime linked in) needs no
  # Visual C++ runtime DLL, so a Windows without the redistributable starts it. GitHub's runners
  # have the redistributable: only the imports tell. On every push, so a tag never finds out.
  windows-binary:
    name: Windows binary needs no Visual C++ runtime
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install --profile minimal
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p isoloom --target x86_64-pc-windows-msvc
      - run: |
          set -euo pipefail
          sysroot="$(cygpath -u "$(rustc --print sysroot)")"
          .github/scripts/no-vc-runtime.sh "${sysroot}/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe" \
            target/x86_64-pc-windows-msvc/release/isoloom.exe

  # Every target's generated files, checked by their tools' own validators in the pinned image
  # (`cargo xtask verify`: docker compose config, terraform validate and tflint, vagrant
  # validate, kubeconform and helm, cloud-init, hadolint, ansible-lint, shellcheck,
  # PSScriptAnalyzer). Isoloom's output is validated, never run: running it is a runner's job.
  # A failure the baseline (xtask/src/verify/baseline.json) doesn't know fails the job.
  validators:
    name: Validators on every target's output
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask verify
      - name: Results
        if: always()
        run: cat target/verify/summary.txt target/verify/new.jsonl 2>/dev/null || true

  # A Compose file, imported and generated: the draft's Compose file is valid for Compose.
  import:
    name: Import a Compose file, then validate the draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Import, generate, validate
        run: |
          set -euo pipefail
          cargo build -q --locked -p isoloom
          shop="$RUNNER_TEMP/shop"
          mkdir -p "$shop" && cp crates/tools/isoloom-import/tests/fixtures/compose-shop/docker-compose.yml "$shop/"
          target/debug/isoloom import compose "$shop/docker-compose.yml"
          target/debug/isoloom generate "$shop" --target docker
          API_TOKEN=t0k docker compose -f "$shop/.isoloom/docker/compose.yml" config -q
