name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Examples validate
        run: |
          for e in examples/*/; do cargo run -q -- validate "$e" --skip-files; cargo run -q -- targets "$e"; done
      - name: Generated files are up to date
        run: |
          for e in examples/hello-stack examples/supplier-portal-api examples/segmented examples/pivot-dmz; do cargo run -q -- check "$e"; done

  # The generated Compose files, run for real: everything answers, and the checks pass.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [hello-stack, segmented]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - name: Start
        run: docker compose -f .isoloom/docker/compose.yml up -d --wait --wait-timeout 300
      - name: Checks
        run: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check
      - name: Logs
        if: failure()
        run: docker compose -f .isoloom/docker/compose.yml --profile check logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f .isoloom/docker/compose.yml --profile check down -v
