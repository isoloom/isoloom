name: CI

# Every push to main and every pull request: formatting, clippy and the tests on Linux, macOS and
# Windows, the quality ratchet, the API docs, the supply chain (cargo-deny, unused dependencies),
# spelling, the links between the docs, SemVer against the last release, the declared minimum
# Rust, deterministic generation, the generated Terraform validated and its modules' tests, and the
# generated Compose and Kubernetes files run for real. The release gate (gate.yml) runs the core of it again on the tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain (its channel, rustfmt and clippy) is pinned by rust-toolchain.toml.
      - run: rustup toolchain install --profile minimal
      - run: cargo fmt --all --check

  # macOS and Windows binaries are released (release.yml), and the CLI has Windows-only code.
  test:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so a pull request can't seed what main builds with.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The engineering-standard ratchet (clean-code counts per crate against xtask/baselines/quality-baseline.json),
  # the fuzz targets' build, the API docs, and every example validating.
  quality:
    name: Quality ratchet, API docs and examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The ratchet counts what cargo-machete reports, so it needs it installed.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      - run: cargo run -p xtask --locked -- quality
      # The fuzz targets (a workspace of their own, outside the others' builds) still build
      # against the crates' public items, formatted and lint-clean.
      - run: cargo run -p xtask --locked -- fuzz --check
      # The API docs build without a warning (broken intra-doc links, bare URLs).
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Every example validates
        run: |
          set -euo pipefail
          cargo build -q --locked -p isoloom
          for e in examples/*/; do
            target/debug/isoloom validate "$e" --skip-files
            target/debug/isoloom targets "$e"
          done

  # The locked dependencies (deny.toml): known vulnerabilities (RustSec), licences on the
  # allow-list, banned crates, and crates.io as the only source.
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Every declared dependency is used.
  machete:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  # Spelling, in code and docs (.typos.toml lists the words that are right here).
  hooks:
    name: Git hooks
    # The hooks (.githooks/, CONTRIBUTING.md "Git hooks"): shellcheck over them, then their test in
    # a throwaway repository, with the gitleaks the pre-push runs.
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned release tarball, its sha256 checked before it runs (from the release's
      # gitleaks_<version>_checksums.txt). Bump the version and the checksum together.
      - name: gitleaks
        run: |
          tarball="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: shellcheck -x .githooks/* scripts/setup-hooks.sh
      - run: .githooks/test.sh

  typos:
    name: Spelling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  # Every link between the Markdown pages reaches a file (offline: no request leaves the runner).
  # The docs test (`cargo test -p isoloom-spec --test docs`) checks the headings links point at.
  links:
    name: Links between the docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            README.md CHANGELOG.md ARCHITECTURE.md '.github/*.md' 'docs/**/*.md'
          fail: true
          jobSummary: true

  # The supported library API (docs/reference/policies.md: isoloom-spec, isoloom-targets and
  # isoloom-manifest), compared by cargo-semver-checks with each crate's latest version on
  # crates.io. The other published crates are building blocks whose API is not a promise. The release type comes from the workspace version: when it is still the
  # published one, the changes are checked as a patch, so a breaking change fails until the version
  # is raised on purpose. One exception, decided for the release after 1.x: while crates.io's
  # latest is a 1.x, the unreleased changes are checked as the 2.0.0 major they are (they remove
  # public API). Once 2.0.0 is published the exception no longer matches and the rule is strict.
  semver:
    name: SemVer against the last release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Release type
        id: release
        run: |
          set -euo pipefail
          published="$(curl -fsS -A "isoloom-ci (https://github.com/isoloom/isoloom)" \
            https://crates.io/api/v1/crates/isoloom-spec | jq -r .crate.max_stable_version)"
          echo "Latest isoloom-spec on crates.io: ${published}"
          case "$published" in
            1.*) echo "args=--release-type major" >> "$GITHUB_OUTPUT" ;;
            *) echo "args=" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: cargo semver-checks
        env:
          RELEASE_ARGS: ${{ steps.release.outputs.args }}
        run: |
          set -euo pipefail
          packages=()
          for crate in isoloom-spec isoloom-targets isoloom-manifest; do
            packages+=(-p "$crate")
          done
          # shellcheck disable=SC2086 # RELEASE_ARGS is empty or one flag and its value.
          cargo semver-checks "${packages[@]}" $RELEASE_ARGS

  # The published crates build with their declared rust-version (1.88, Cargo.toml). `+1.88`
  # overrides the rust-toolchain.toml pin for this check only (without it the pinned toolchain
  # would build, and the job would prove nothing). The development tasks (xtask, xtask-quality)
  # are not published and build with the pinned toolchain only.
  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.88 check --workspace --exclude xtask --exclude xtask-quality --all-targets --locked

  # Generation is deterministic: every example rendered twice in one process (the test), then
  # generated twice by the command line in the same folder, gives the same files.
  determinism:
    name: Deterministic generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p isoloom-targets --test targets determinism
      - name: The command line, twice
        run: |
          set -euo pipefail
          cargo build -q --locked -p isoloom
          for e in examples/*/; do
            n=$(basename "$e")
            for run in 1 2; do
              rm -rf "$e.isoloom"
              target/debug/isoloom generate "$e" > /dev/null
              mkdir -p "$RUNNER_TEMP/$run/$n"
              cp -R "$e.isoloom" "$RUNNER_TEMP/$run/$n/"
            done
          done
          diff -r "$RUNNER_TEMP/1" "$RUNNER_TEMP/2"

  # The generated Terraform (Proxmox, ESXi, docker-vm on Proxmox, cloud-docker, cloud-vm,
  # cloud-services) is valid for its providers, with the latest Terraform.
  terraform:
    name: Terraform validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate every example (the targets each can be generated for)
        run: |
          set -euo pipefail
          cargo build -q --locked -p isoloom
          for e in examples/*/; do target/debug/isoloom generate "$e" > /dev/null; done
      - name: Validate
        run: |
          set -euo pipefail
          shopt -s nullglob
          validate() {
            echo "== $1"
            terraform -chdir="$1" init -backend=false -input=false >/dev/null
            terraform -chdir="$1" validate
          }
          for d in examples/*/.isoloom/proxmox examples/*/.isoloom/docker-vm/proxmox examples/*/.isoloom/esxi examples/*/.isoloom/cloud-docker/* examples/*/.isoloom/cloud-vm/*; do
            validate "$d"
          done
          # cloud-services runs the lab's own module, which its run manifest copies (`from`).
          for d in examples/*/.isoloom/cloud-services; do
            validate "$d/$(jq -r '.lifecycle.up[] | select(.action == "terraform.copy_module") | .with.from' "$d/run.json")"
          done

  # The cloud and server modules' logic proven without a cloud (`cargo xtask tf-test`): every
  # provider mocked, every run a plan, in the pinned validator image. Its expectations
  # (tests/terraform/) break unseen otherwise.
  tf-test:
    name: Terraform module tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p xtask --locked -- tf-test

  # The binaries the real-run jobs below share: isoloom, and the Isothrum runner built from its
  # repository at ISOTHRUM_REF (a repository variable: a release tag or a commit, never a branch,
  # so a run is reproducible), so each job doesn't build both again. Without ISOTHRUM_REF the
  # Compose real runs are skipped; the jobs that need isoloom alone still run.
  binaries:
    name: Binaries for the real runs
    runs-on: ubuntu-24.04
    env:
      ISOTHRUM_REF: ${{ vars.ISOTHRUM_REF }}
    outputs:
      runner: ${{ steps.ref.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isothrum's ref, pinned
        id: ref
        run: |
          set -uo pipefail
          status=0
          .github/scripts/isothrum-ref.sh optional || status=$?
          case "$status" in
            0) echo "runner=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "runner=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Check out Isothrum (the runner)
        if: steps.ref.outputs.runner == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Isothrum/isothrum
          ref: ${{ env.ISOTHRUM_REF }}
          path: .isothrum-src
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        env:
          RUNNER: ${{ steps.ref.outputs.runner }}
        run: |
          set -euo pipefail
          cargo build -q --locked -p isoloom
          mkdir -p bin
          cp target/debug/isoloom bin/
          if [ "$RUNNER" = true ]; then
            cargo build -q --locked -p isothrum-cli --manifest-path .isothrum-src/Cargo.toml
            cp .isothrum-src/target/debug/isothrum bin/
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: bin/
          if-no-files-found: error
          retention-days: 3

  # The generated Compose files, run for real through the Isothrum runner: Isoloom generates the
  # files, `isothrum up` brings the example up, `isothrum check` passes (the spec's checks and the
  # ones derived from its services and reach rules), and `isothrum down` leaves nothing behind.
  docker:
    name: Compose, run for real (${{ matrix.example }})
    needs: binaries
    if: needs.binaries.outputs.runner == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The examples with a container form (tuned-web asks for a TPM: VM targets only).
        example: [hello-stack, air-gapped, segmented, edge-firewall, slow-link, udp-dns, shared-files]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - name: Put the binaries on the PATH
        working-directory: .
        run: |
          chmod +x "$RUNNER_TEMP/bin/"*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generate the Compose files
        run: isoloom generate --target docker .
      - name: Up
        id: up
        run: isothrum up . --target docker
      - name: Checks (the spec's and the derived ones, from every machine)
        if: steps.up.outcome == 'success'
        run: isothrum check . --target docker
      - name: Logs
        if: failure()
        run: docker compose -f .isoloom/docker/compose.yml --profile check logs --no-color
      - name: Down (nothing left)
        id: down
        if: always() && steps.up.outcome == 'success'
        run: |
          isothrum down . --target docker
          test -z "$(docker ps -aq --filter label=isoloom.managed=true)"
      - name: Stop
        if: always() && steps.down.outcome != 'success'
        run: docker compose -f .isoloom/docker/compose.yml --profile check down -v || true

  # The Kubernetes output on a real (throwaway) cluster: built images loaded, the environment
  # applied and Available, then its checks as a Job (segmented's "cache is blocked" proves the
  # network policies are enforced).
  kubernetes:
    name: Kubernetes on kind (${{ matrix.example }})
    needs: binaries
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [hello-stack, segmented, shared-files]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: isoloom
          config: .github/kind-calico.yaml
          wait: 0s
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - name: Put the binaries on the PATH
        working-directory: .
        run: |
          chmod +x "$RUNNER_TEMP/bin/"*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generate the Kubernetes files
        run: isoloom generate --target kubernetes .
      - name: Calico (enforces NetworkPolicies, egress included)
        working-directory: .
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: Build and load the project's images
        run: |
          grep -E '^#   docker build -t ' .isoloom/kubernetes/environment.yaml | sed 's/^#   //' | while read -r cmd; do
            $cmd
            kind load docker-image --name isoloom "$(echo "$cmd" | awk '{print $4}')"
          done
      - name: Start
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone .isoloom/kubernetes | kubectl apply -f -
          ns=$(awk '/^kind: Namespace/{getline; getline; print $2; exit}' .isoloom/kubernetes/environment.yaml)
          echo "NS=$ns" >> "$GITHUB_ENV"
          kubectl -n "$ns" wait --for=condition=Available deployment --all --timeout=600s
      - name: Checks (the spec's and the derived ones, from every machine)
        # As .isoloom/kubernetes/checks says to run them: a Job per position, then their logs.
        run: |
          kubectl apply -k .isoloom/kubernetes/checks
          kubectl -n "$NS" wait --for=condition=complete job --all --timeout=300s
          kubectl -n "$NS" logs -l isoloom.com/check --tail=-1
      # The Helm chart of the same environment, in a namespace of its own beside it: linted,
      # installed, Available, and its checks as `helm test`.
      - name: Helm chart (lint, install, helm test)
        run: |
          helm lint .isoloom/kubernetes/chart
          helm install env .isoloom/kubernetes/chart -n "helm-$NS" --create-namespace
          kubectl -n "helm-$NS" wait --for=condition=Available deployment --all --timeout=600s
          helm test env -n "helm-$NS" --logs --timeout 5m
      - name: Package the chart
        run: |
          helm package .isoloom/kubernetes/chart --version 1.2.3 -d "$RUNNER_TEMP"
          ls "$RUNNER_TEMP"/*-1.2.3.tgz
      - name: State
        if: failure()
        run: |
          kubectl -n "helm-$NS" get all,networkpolicy,pvc,job -o wide || true
          kubectl -n "$NS" get all,networkpolicy,pvc -o wide || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs --all-containers --prefix -l isoloom.com/machine --tail=50 || true

  # A Compose file, imported, generated and started: the draft runs.
  import:
    name: Import a Compose file, then run it
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - name: Import, generate
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/"*
          shop="$RUNNER_TEMP/shop"
          echo "SHOP=$shop" >> "$GITHUB_ENV"
          mkdir -p "$shop" && cp crates/tools/isoloom-import/tests/fixtures/compose-shop/docker-compose.yml "$shop/"
          "$RUNNER_TEMP/bin/isoloom" import compose "$shop/docker-compose.yml"
          "$RUNNER_TEMP/bin/isoloom" generate "$shop" --target docker
      - name: Start
        run: API_TOKEN=t0k docker compose -f "$SHOP/.isoloom/docker/compose.yml" up -d --wait --wait-timeout 180
      - name: Behaves like the original
        run: |
          docker compose -f "$SHOP/.isoloom/docker/compose.yml" exec -T cache wget -qO- http://web/ | grep -q "Welcome to nginx"
          test "$(docker compose -f "$SHOP/.isoloom/docker/compose.yml" exec -T web printenv API_TOKEN)" = t0k
      - name: Stop
        if: always()
        run: docker compose -f "$SHOP/.isoloom/docker/compose.yml" down -v
