name: Release

# A tag `v<version>` builds the isoloom binary for macOS, Linux and Windows and publishes them as
# the release of that tag: `isoloom-<target>.tar.gz` (`.zip` on Windows) with SHA-256 sums.
# install.sh and the GitHub Action (action.yml) download these.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag names the workspace's version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $have"
            exit 1
          fi
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked -p isoloom --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../isoloom-${{ matrix.target }}.tar.gz isoloom
          cd ../../..
          shasum -a 256 isoloom-${{ matrix.target }}.tar.gz > isoloom-${{ matrix.target }}.tar.gz.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/isoloom.exe -DestinationPath isoloom-${{ matrix.target }}.zip
          $h = (Get-FileHash isoloom-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          # LF, not Out-File's CRLF, so `sha256sum -c` and `shasum -c` read the file name as it is.
          [IO.File]::WriteAllText("isoloom-${{ matrix.target }}.zip.sha256", "$h  isoloom-${{ matrix.target }}.zip`n")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isoloom-${{ matrix.target }}
          path: isoloom-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the version's CHANGELOG section (its heading left out), else GitHub's own.
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p=(index($0, "## " v " ")==1 || $0=="## " v); if(p) next} p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Isoloom ${GITHUB_REF_NAME#v}" "${notes[@]}"
