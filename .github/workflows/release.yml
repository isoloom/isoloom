name: Release

# The release binaries of `isoloom`, on a tag `vX.Y.Z`: after the release gate (gate.yml), one
# archive per platform, a CycloneDX SBOM, SHA256SUMS over them, a keyless Sigstore signature of
# SHA256SUMS (cosign; the identity is this workflow at the tag), a build provenance attestation of
# every file, and a GitHub release whose notes are the CHANGELOG's section for the version. Then
# the published release is installed the ways users install it (packaging/install.sh and the
# GitHub Action) and run, so a broken release is caught at once, and the website is checked to
# serve the release's schema and the docs the CLI links to.
#
# The archives are `isoloom-<target>.tar.gz` (`.zip` on Windows), each holding a folder
# `isoloom-<target>/` with the binary, LICENSE, NOTICE, README.md and THIRD-PARTY-LICENSES.md.
# packaging/install.sh, action.yml and docs/guide/verify-a-release.md read these names. The
# crates go to crates.io from publish-crates.yml, on the same tag.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read

  # The tag must name the workspace version, and the CHANGELOG must have its section.
  plan:
    needs: gate
    name: Version and release notes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - name: The tag is the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "isoloom") | .version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} isn't the workspace version (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Everything under `## [X.Y.Z]` up to the next `## [` heading.
          awk -v head="## [${VERSION}]" '
            /^## \[/ { if (found) exit; if (index($0, head) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          {
            echo
            echo "Verify a download: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/guide/verify-a-release.md"
          } >> release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
      # The licence of every crate the binary is built from, shipped in each archive.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - name: Third-party licences
        run: |
          cargo about generate --locked -c .github/release/about.toml \
            --manifest-path crates/cli/isoloom/Cargo.toml \
            .github/release/about.hbs -o THIRD-PARTY-LICENSES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.md
          if-no-files-found: error

  build:
    needs: plan
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml's toolchain, plus the target. No cache: a release builds from scratch.
      - name: Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add "$TARGET"
      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: cargo build --release --locked -p isoloom --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
      - name: Package
        run: |
          set -euo pipefail
          name="isoloom-${TARGET}"
          mkdir -p "dist/${name}"
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${TARGET}/release/isoloom${ext}" "dist/${name}/"
          cp LICENSE NOTICE README.md THIRD-PARTY-LICENSES.md "dist/${name}/"
          cd dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" >/dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: plan
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9
      # The CLI's dependency tree on every platform (`--target all`), from Cargo.lock. The tool
      # writes one file per workspace member; the release keeps the CLI's.
      - name: SBOM of isoloom
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path crates/cli/isoloom/Cargo.toml --format json \
            --spec-version 1.5 --target all --override-filename isoloom.cdx
          mkdir -p dist
          mv crates/cli/isoloom/isoloom.cdx.json dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, build, sbom]
    name: Sign, attest and publish the release
    runs-on: ubuntu-24.04
    # Approval and tag rules for publishing a release are set on this environment.
    environment: release
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Keyless signing (Sigstore) and the provenance attestations take an OIDC token.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # A keyless signature: the certificate names this workflow at the tag, recorded in Rekor.
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Isoloom ${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease[@]}"

  # The published release, installed the way users install it and run: packaging/install.sh on
  # Linux and macOS (it checks the archive against SHA256SUMS), the signature and the provenance
  # checked as docs/guide/verify-a-release.md says, then a spec validated and generated.
  installed:
    needs: release
    name: Install with install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        env:
          ISOLOOM_VERSION: ${{ github.ref_name }}
          ISOLOOM_INSTALL_DIR: ${{ runner.temp }}/isoloom-bin
        run: |
          set -eu
          sh packaging/install.sh
          "$ISOLOOM_INSTALL_DIR/isoloom" --version | grep -qx "isoloom ${TAG#v}"
          echo "$ISOLOOM_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Validate and generate an example
        run: |
          set -eu
          cp -R examples/hello-stack "$RUNNER_TEMP/hello-stack"
          isoloom validate "$RUNNER_TEMP/hello-stack"
          isoloom generate --target docker "$RUNNER_TEMP/hello-stack"
          test -s "$RUNNER_TEMP/hello-stack/.isoloom/docker/compose.yml"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: matrix.os == 'ubuntu-24.04'
        with:
          cosign-release: v3.1.4
      - name: Signature and provenance
        if: matrix.os == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p SHA256SUMS -p SHA256SUMS.sigstore.json -p isoloom-x86_64-unknown-linux-musl.tar.gz
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify isoloom-x86_64-unknown-linux-musl.tar.gz \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"

  # The GitHub Action (action.yml at the tag), on every OS it supports: Windows has its own path.
  action:
    needs: release
    name: Install with the Action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          version: ${{ github.ref_name }}
      - name: Run it
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          isoloom --version | tr -d '\r' | grep -qx "isoloom ${TAG#v}"
          isoloom validate examples/hello-stack

  # The website (its own repository) serves the docs generated from this repository's docs/ and
  # the committed schema at its `$id`, deployed for the release (docs/dev/releasing.md, "Publish
  # the website"). Once it is: every www.isoloom.com link the CLI and the schema print answers, and
  # the served schema is schemas/spec-v1.schema.json. It polls for up to 40 minutes, so a deploy
  # that follows the tag is waited for; a failure means users follow dead links: fix the website.
  website:
    needs: release
    name: The website serves the schema and the CLI's doc links
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Schema and doc links
        run: |
          set -euo pipefail
          schema_url=$(jq -r '."$id"' schemas/spec-v1.schema.json)
          links=$(grep -rhoE 'https://www\.isoloom\.com/[^] )"`>\\#]*' crates/cli/isoloom/src crates/core/isoloom-spec/src/schema.rs | sort -u)
          jq -S . schemas/spec-v1.schema.json > "$RUNNER_TEMP/committed.json"
          check() {
            for url in $links; do
              curl -fsSL -o /dev/null "$url" || { echo "$url doesn't answer"; return 1; }
            done
            curl -fsSL "$schema_url" | jq -S . > "$RUNNER_TEMP/served.json" || { echo "$schema_url isn't JSON"; return 1; }
            diff -q "$RUNNER_TEMP/committed.json" "$RUNNER_TEMP/served.json" >/dev/null \
              || { echo "$schema_url isn't schemas/spec-v1.schema.json"; return 1; }
          }
          for _ in $(seq 40); do
            if check; then echo "The website answers every link, with this release's schema."; exit 0; fi
            sleep 60
          done
          echo "::error::the website doesn't serve this release's schema or the CLI's doc links (docs/dev/releasing.md)"
          exit 1
