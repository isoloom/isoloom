name: Release

# A tag `v<version>` builds the isoloom binary for macOS, Linux and Windows and publishes them as
# the release of that tag: `isoloom-<target>.tar.gz` (`.zip` on Windows) with SHA-256 sums.
# install.sh and the GitHub Action (action.yml) download these.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked -p isoloom --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../isoloom-${{ matrix.target }}.tar.gz isoloom
          cd ../../..
          shasum -a 256 isoloom-${{ matrix.target }}.tar.gz > isoloom-${{ matrix.target }}.tar.gz.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/isoloom.exe -DestinationPath isoloom-${{ matrix.target }}.zip
          $h = (Get-FileHash isoloom-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$h  isoloom-${{ matrix.target }}.zip" | Out-File -Encoding ascii isoloom-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: isoloom-${{ matrix.target }}
          path: isoloom-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Isoloom ${GITHUB_REF_NAME#v}" --generate-notes
