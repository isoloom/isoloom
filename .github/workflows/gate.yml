name: Gate

# The test + quality-ratchet gate a release tag must pass before anything is published. Called by
# publish-crates.yml (crates.io) and release.yml (the CLI binaries) through `needs`, so a tag that
# fails rustfmt, clippy, the workspace tests or the ratchet publishes nothing. Reusable
# (workflow_call) so the two release workflows share one definition. Push/pull-request CI lives in
# ci.yml and stays off until the maintainer turns it on; this runs only on the release path.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: Tests and the quality ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      # The engineering-standard ratchet (clean-code counts per crate against xtask/baselines/quality-baseline.json).
      - run: cargo run -p xtask -- quality
