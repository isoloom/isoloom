name: Gate

# The test + quality-ratchet gate a release tag must pass before anything is published. Called
# through `needs` by publish-crates.yml (crates.io) and release.yml (the release binaries), so a tag
# that fails rustfmt, clippy, the workspace tests, the API docs or the ratchet publishes nothing.
# Reusable (workflow_call), so a release workflow calls it rather than repeat it. CI on pushes and
# pull requests is ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: Tests and the quality ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain (its channel, rustfmt and clippy) is pinned by rust-toolchain.toml.
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A tag's run reads the cache main wrote; it never writes one.
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The API docs build with every link resolved.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The engineering-standard ratchet (clean-code counts per crate against
      # xtask/baselines/quality-baseline.json). It counts what cargo-machete reports, so it needs it installed.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      - run: cargo run -p xtask --locked -- quality
