[workspace]
resolver = "3"
members = ["crates/isoloom-core", "crates/isoloom"]

[workspace.package]
version = "0.7.2"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/isoloom/isoloom"
publish = false

[workspace.dependencies]
isoloom-core = { path = "crates/isoloom-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
schemars = { version = "1", features = ["indexmap2"] }
hcl-rs = "0.19"
