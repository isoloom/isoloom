[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.1"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/isoloom/isoloom"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
isoloom-spec = { path = "crates/isoloom-spec" }
isoloom-plan = { path = "crates/isoloom-plan" }
isoloom-render = { path = "crates/isoloom-render" }
isoloom-compose = { path = "crates/isoloom-compose" }
isoloom-kubernetes = { path = "crates/isoloom-kubernetes" }
isoloom-terraform = { path = "crates/isoloom-terraform" }
isoloom-vagrant = { path = "crates/isoloom-vagrant" }
isoloom-external = { path = "crates/isoloom-external" }
isoloom-targets = { path = "crates/isoloom-targets" }
isoloom-import = { path = "crates/isoloom-import" }
isoloom-runtime = { path = "crates/isoloom-runtime" }
isoloom-manifest = { path = "crates/isoloom-manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
schemars = { version = "1", features = ["indexmap2"] }
hcl-rs = "0.19"
thiserror = "2"
insta = { version = "1", features = ["yaml"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serde_path_to_error = "0.1"
jsonschema = { version = "0.58", default-features = false }

# Every crate inherits these (`[lints] workspace = true`); see CONTRIBUTING.md. Every lint is at
# "deny": a new exception is a local `#[allow]` with a one-line reason, never an entry here.
[workspace.lints.rust]
# No exception: a profile's inputs reach the tools through `Command::envs`, not `set_var`.
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Pedantic lints left out on purpose:
must_use_candidate = "allow"         # nearly every getter qualifies; `#[must_use]` goes where ignoring is a bug.
missing_errors_doc = "allow"         # errors are typed enums whose variants document themselves.
missing_panics_doc = "allow"         # panics are denied outside tests (`expect_used`, `panic`).
doc_markdown = "allow"               # prose names products (Docker, VirtualBox, OpenTofu) and keys, not code.
similar_names = "allow"              # `src`/`dst`, `cidr`/`cidrs` read fine.
too_many_lines = "deny"              # pedantic; threshold 60 in clippy.toml
cognitive_complexity = "deny"        # nursery; threshold 15 in clippy.toml
# Restriction lints (tests may unwrap, expect and panic: see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"                # libraries; the command line allows it (its output is its interface).
too_many_arguments = "deny"          # threshold 5 in clippy.toml
