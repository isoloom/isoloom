# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: edge-firewall
services:
  fw:
    build:
      context: ../../build/fw
      labels:
        isoloom.managed: 'true'
        isoloom.environment: edge-firewall
    image: isoloom/edge-firewall-fw
    platform: linux/amd64
    sysctls:
      net.ipv4.ip_forward: '1'
    hostname: fw
    networks:
      outside:
        ipv4_address: 10.70.0.5
      dmz:
        ipv4_address: 10.70.10.1
      lan:
        ipv4_address: 10.70.20.1
    cap_add:
    - NET_ADMIN
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8080
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.port.status: http:8080
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
    restart: unless-stopped
  fw-routes:
    image: alpine:3.20
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace default via 10.70.0.1 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    network_mode: service:fw
    cap_add:
    - NET_ADMIN
    healthcheck:
      test:
      - CMD-SHELL
      - ip route | grep -q '^default via 10.70.0.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      fw:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
    restart: unless-stopped
  web:
    build:
      context: ../../build/web
      labels:
        isoloom.managed: 'true'
        isoloom.environment: edge-firewall
    image: isoloom/edge-firewall-web
    platform: linux/amd64
    hostname: web
    networks:
      dmz:
        ipv4_address: 10.70.10.10
        aliases:
        - www.edge.test
    extra_hosts:
    - cache:10.70.20.20
    - user:10.70.0.10
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.port.80: http:80
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
    restart: unless-stopped
  web-routes:
    image: alpine:3.20
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.70.20.0/24 via 10.70.10.1 && ip route replace default via 10.70.10.1 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    network_mode: service:web
    cap_add:
    - NET_ADMIN
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.70.20.0/24 | grep -q via && ip route | grep -q '^default via 10.70.10.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      web:
        condition: service_started
      fw:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
    restart: unless-stopped
  cache:
    image: redis:7-alpine
    platform: linux/amd64
    hostname: cache
    networks:
      lan:
        ipv4_address: 10.70.20.20
    extra_hosts:
    - web:10.70.10.10
    - www.edge.test:10.70.10.10
    - user:10.70.0.10
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 6379
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.port.redis: tcp:6379
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
    restart: unless-stopped
  cache-routes:
    image: alpine:3.20
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.70.10.0/24 via 10.70.20.1 && ip route replace default via 10.70.20.1 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    network_mode: service:cache
    cap_add:
    - NET_ADMIN
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.70.10.0/24 | grep -q via && ip route | grep -q '^default via 10.70.20.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      cache:
        condition: service_started
      fw:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
    restart: unless-stopped
  isoloom-access:
    image: alpine:3.20
    profiles:
    - check
    entrypoint:
    - sleep
    - infinity
    hostname: user
    networks:
      outside:
        ipv4_address: 10.70.0.10
    extra_hosts:
    - web:10.70.10.10
    - www.edge.test:10.70.10.10
    - cache:10.70.20.20
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
  isoloom-access-routes:
    image: alpine:3.20
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.70.10.0/24 via 10.70.0.5 && ip route replace 10.70.20.0/24 via 10.70.0.5 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    network_mode: service:isoloom-access
    cap_add:
    - NET_ADMIN
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.70.10.0/24 | grep -q via
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      isoloom-access:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:isoloom-access
    volumes:
    - ./checks/user.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    depends_on:
      fw:
        condition: service_healthy
      fw-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
      isoloom-access:
        condition: service_started
      isoloom-access-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
  isoloom-check-fw:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:fw
    volumes:
    - ./checks/fw.sh:/isoloom/run.sh:ro
    depends_on:
      fw:
        condition: service_healthy
      fw-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
  isoloom-check-web:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:web
    volumes:
    - ./checks/web.sh:/isoloom/run.sh:ro
    depends_on:
      fw:
        condition: service_healthy
      fw-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
  isoloom-check-cache:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:cache
    volumes:
    - ./checks/cache.sh:/isoloom/run.sh:ro
    depends_on:
      fw:
        condition: service_healthy
      fw-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    network_mode: none
    volumes:
    - isoloom-probe-amd64:/probe
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
    restart: no
networks:
  outside:
    ipam:
      config:
      - subnet: 10.70.0.0/24
        gateway: 10.70.0.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
  dmz:
    ipam:
      config:
      - subnet: 10.70.10.0/24
        gateway: 10.70.10.254
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
  lan:
    ipam:
      config:
      - subnet: 10.70.20.0/24
        gateway: 10.70.20.254
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: edge-firewall
