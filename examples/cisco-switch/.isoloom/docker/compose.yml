# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: cisco-switch
services:
  sw1:
    image: vrnetlab/cisco_iol:L2-17.12.01
    platform: linux/amd64
    hostname: sw1
    networks:
      isoloom-mgmt:
        ipv4_address: 10.255.255.10
        interface_name: eth0
        priority: 1000
      office-vlan10:
        ipv4_address: 10.92.10.253
        interface_name: eth1
        priority: 999
      office-vlan20:
        ipv4_address: 10.92.20.253
        interface_name: eth2
        priority: 998
      isoloom-trunk-office-files:
        interface_name: eth3
        priority: 997
    extra_hosts:
    - files:10.92.10.10
    - staff:10.92.10.20
    - guest:10.92.20.20
    volumes:
    - ./appliances/sw1/base.txt:/iol/base.txt:ro
    - ./appliances/sw1/NETMAP:/iol/NETMAP:ro
    - ./appliances/sw1/iouyap.ini:/iol/iouyap.ini:ro
    - ../../configs/sw1.cfg:/iol/own.txt:ro
    entrypoint:
    - /bin/sh
    - -c
    - cat /iol/base.txt /iol/own.txt > /iol/config.txt 2>/dev/null; echo end >> /iol/config.txt; exec /entrypoint.sh
    environment:
      IOL_PID: '1'
    cap_add:
    - NET_ADMIN
    - NET_RAW
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  sw1-routes:
    image: alpine:3.20
    network_mode: service:sw1
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip addr flush dev eth1 && ip addr flush dev eth2 && ip addr flush dev eth3 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip -o -4 addr show | grep -q '' eth[1-9]'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      sw1:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  files:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: files
    networks:
      isoloom-trunk-office-files:
        mac_address: 02:1e:72:d0:bc:1c
    extra_hosts:
    - staff:10.92.10.20
    - guest:10.92.20.20
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.80: http:80
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
    restart: unless-stopped
  files-routes:
    image: nicolaka/netshoot:v0.13
    network_mode: service:files
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - 'IF=$$(ip -o link | awk ''tolower($$0) ~ /02:1e:72:d0:bc:1c/ {print $$2}'' | cut -d@ -f1 | tr -d : | head -n 1) && ip addr flush dev $$IF && ip link set $$IF down && ip link set $$IF name office && ip link set office up && ip link add link office name office.10 type vlan id 10 && ip addr add 10.92.10.10/24 dev office.10 && ip link set office.10 up && ip link add link office name office.20 type vlan id 20 && ip addr add 10.92.20.10/24 dev office.20 && ip link set office.20 up && while ip -o -4 addr show | grep -qv '' lo ''; do sleep 2; done; exit 1'
    healthcheck:
      test:
      - CMD-SHELL
      - ip link show office.10 | grep -q 'UP' && ip link show office.20 | grep -q 'UP'
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      files:
        condition: service_started
      sw1:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  staff:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: staff
    networks:
      office-vlan10:
        ipv4_address: 10.92.10.20
    extra_hosts:
    - files:10.92.10.10
    - guest:10.92.20.20
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  guest:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: guest
    networks:
      office-vlan20:
        ipv4_address: 10.92.20.20
    extra_hosts:
    - files:10.92.20.10
    - staff:10.92.10.20
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  isoloom-check-files:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/files.sh:/isoloom/run.sh:ro
    network_mode: service:files
    depends_on:
      sw1-routes:
        condition: service_healthy
      files:
        condition: service_healthy
      files-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  isoloom-check-staff:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/staff.sh:/isoloom/run.sh:ro
    network_mode: service:staff
    depends_on:
      sw1-routes:
        condition: service_healthy
      files:
        condition: service_healthy
      files-routes:
        condition: service_healthy
      staff:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  isoloom-check-guest:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/guest.sh:/isoloom/run.sh:ro
    network_mode: service:guest
    depends_on:
      sw1-routes:
        condition: service_healthy
      files:
        condition: service_healthy
      files-routes:
        condition: service_healthy
      guest:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
networks:
  office-vlan10:
    ipam:
      config:
      - subnet: 10.92.10.0/24
        gateway: 10.92.10.1
    internal: true
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  office-vlan20:
    ipam:
      config:
      - subnet: 10.92.20.0/24
        gateway: 10.92.20.1
    internal: true
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  isoloom-trunk-office-files:
    internal: true
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
  isoloom-mgmt:
    ipam:
      config:
      - subnet: 10.255.255.0/24
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-switch
