# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# A small Active Directory domain: VM targets only (Windows has no container form).
version: 1
name: corp-ad-basics

networks:
  dmz: { cidr: 10.40.10.0/24 }
  corp: { cidr: 10.40.20.0/24 }
  access: { cidr: 10.40.99.0/24 }

reach:
  - { from: access, to: dmz }
  - { from: dmz, to: corp }

# Shared fields: every Windows box gets the same size through its group, and the group is an
# Ansible inventory group for the domain playbooks.
groups:
  domain:
    members: [dc01, ws]      # ws means both workstations
    resources: { cpus: 2, memory_mb: 4096, disk_gb: 60 }

machines:
  dc01:
    networks: { corp: 5 }
    services: [{ port: 53 }, { port: 88 }, { port: 389 }, { port: 445 }]
    vm:
      os: windows-server-2022
      provision: [provision/ad-domain.yml]
  ws:
    count: 2                   # ws-01 and ws-02, at .21 and .22
    networks: { corp: 21 }
    depends_on: [dc01]
    vm:
      os: windows-11
      provision: [provision/ad-join.yml, provision/ws.yml]
  web01:
    networks: { dmz: 10, corp: 10 }
    services: [{ port: 80 }]
    docker:
      build: build/web01
    vm:
      os: debian-12
      provision: [provision/web01.yml]
  user:
    access: true
    networks: { access: 10 }

checks:
  - checks/domain-up.sh
  - checks/web01-reaches-dc01.sh
