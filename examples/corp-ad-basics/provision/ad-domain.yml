# Promotes dc01 to the first domain controller of a new forest, corp.example. Its directory
# restore password is its own administrator's, from the inventory.
- hosts: dc01
  gather_facts: false
  tasks:
    - name: The AD DS role
      ansible.windows.win_feature: { name: AD-Domain-Services, include_management_tools: true }
    - name: The corp.example forest
      microsoft.ad.domain:
        dns_domain_name: corp.example
        safe_mode_password: "{{ ansible_password }}"
        reboot: true
