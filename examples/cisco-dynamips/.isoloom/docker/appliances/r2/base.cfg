hostname r2
!
no ip domain lookup
ip domain name lab
!
username admin privilege 15 secret admin
!
interface FastEthernet0/0
 description site-b
 ip address 10.93.2.1 255.255.255.0
 no shutdown
!
interface FastEthernet1/0
 description wan
 ip address 10.93.0.3 255.255.255.248
 no shutdown
!
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh telnet
!
