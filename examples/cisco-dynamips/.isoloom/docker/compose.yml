# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: cisco-dynamips
services:
  r1:
    volumes:
    - ./appliances/r1/base.cfg:/config/base.cfg:ro
    - ../../configs/r1.cfg:/config/own.cfg:ro
    - ../../images/c7200.bin:/firmware/ios.bin:ro
    platform: linux/amd64
    hostname: r1
    networks:
      isoloom-mgmt:
        ipv4_address: 10.255.255.10
        interface_name: eth0
        priority: 1000
      site-a:
        ipv4_address: 10.93.1.1
        interface_name: eth1
        priority: 999
      wan:
        ipv4_address: 10.93.0.2
        interface_name: eth2
        priority: 998
    cap_add:
    - NET_ADMIN
    - NET_RAW
    sysctls:
      net.ipv4.ip_forward: '1'
    extra_hosts:
    - host-b:10.93.2.10
    build:
      context: ./appliances/r1/build
    entrypoint:
    - /bin/sh
    - -c
    - cat /config/base.cfg /config/own.cfg > /config/startup-config.cfg 2>/dev/null; echo end >> /config/startup-config.cfg; cd /tmp && exec dynamips $$DYNAMIPS_ARGS /firmware/ios.bin
    environment:
      DYNAMIPS_ARGS: -P 7200 -r 512 -T 2000 -C /config/startup-config.cfg -p 1:PA-2FE-TX -s 0:0:linux_eth:eth1 -s 1:0:linux_eth:eth2
    restart: unless-stopped
  r1-routes:
    image: alpine:3.20
    network_mode: service:r1
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip addr flush dev eth1 && ip addr flush dev eth2 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip -o -4 addr show | grep -q '' eth[1-9]'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      r1:
        condition: service_started
    restart: unless-stopped
  r2:
    volumes:
    - ./appliances/r2/base.cfg:/config/base.cfg:ro
    - ../../configs/r2.cfg:/config/own.cfg:ro
    - ../../images/c7200.bin:/firmware/ios.bin:ro
    platform: linux/amd64
    hostname: r2
    networks:
      isoloom-mgmt:
        ipv4_address: 10.255.255.11
        interface_name: eth0
        priority: 1000
      site-b:
        ipv4_address: 10.93.2.1
        interface_name: eth1
        priority: 999
      wan:
        ipv4_address: 10.93.0.3
        interface_name: eth2
        priority: 998
    cap_add:
    - NET_ADMIN
    - NET_RAW
    sysctls:
      net.ipv4.ip_forward: '1'
    extra_hosts:
    - host-a:10.93.1.10
    build:
      context: ./appliances/r2/build
    entrypoint:
    - /bin/sh
    - -c
    - cat /config/base.cfg /config/own.cfg > /config/startup-config.cfg 2>/dev/null; echo end >> /config/startup-config.cfg; cd /tmp && exec dynamips $$DYNAMIPS_ARGS /firmware/ios.bin
    environment:
      DYNAMIPS_ARGS: -P 7200 -r 512 -T 2000 -C /config/startup-config.cfg -p 1:PA-2FE-TX -s 0:0:linux_eth:eth1 -s 1:0:linux_eth:eth2
    restart: unless-stopped
  r2-routes:
    image: alpine:3.20
    network_mode: service:r2
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip addr flush dev eth1 && ip addr flush dev eth2 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip -o -4 addr show | grep -q '' eth[1-9]'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      r2:
        condition: service_started
    restart: unless-stopped
  host-a:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: host-a
    networks:
      site-a:
        ipv4_address: 10.93.1.10
    extra_hosts:
    - r2:10.93.2.1
    - host-b:10.93.2.10
    restart: unless-stopped
  host-a-routes:
    image: alpine:3.20
    network_mode: service:host-a
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace default via 10.93.1.1 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route | grep -q '^default via 10.93.1.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      host-a:
        condition: service_started
      r1:
        condition: service_started
    restart: unless-stopped
  host-b:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: host-b
    networks:
      site-b:
        ipv4_address: 10.93.2.10
    extra_hosts:
    - r1:10.93.1.1
    - host-a:10.93.1.10
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  host-b-routes:
    image: alpine:3.20
    network_mode: service:host-b
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace default via 10.93.2.1 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route | grep -q '^default via 10.93.2.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      host-b:
        condition: service_started
      r2:
        condition: service_started
    restart: unless-stopped
  isoloom-check-host-a:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/host-a.sh:/isoloom/run.sh:ro
    network_mode: service:host-a
    depends_on:
      r1-routes:
        condition: service_healthy
      r2-routes:
        condition: service_healthy
      host-a-routes:
        condition: service_healthy
      host-b:
        condition: service_healthy
      host-b-routes:
        condition: service_healthy
      host-a:
        condition: service_started
networks:
  site-a:
    ipam:
      config:
      - subnet: 10.93.1.0/24
        gateway: 10.93.1.254
  site-b:
    ipam:
      config:
      - subnet: 10.93.2.0/24
        gateway: 10.93.2.254
  wan:
    ipam:
      config:
      - subnet: 10.93.0.0/29
        gateway: 10.93.0.1
  isoloom-mgmt:
    ipam:
      config:
      - subnet: 10.255.255.0/24
