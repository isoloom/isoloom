# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: cisco-iol
services:
  r1:
    image: vrnetlab/cisco_iol:17.12.01
    platform: linux/amd64
    hostname: r1
    networks:
      isoloom-mgmt:
        ipv4_address: 10.255.255.10
        interface_name: eth0
        priority: 1000
      site-a:
        ipv4_address: 10.91.1.1
        interface_name: eth1
        priority: 999
      wan:
        ipv4_address: 10.91.0.2
        interface_name: eth2
        priority: 998
    cap_add:
    - NET_ADMIN
    - NET_RAW
    sysctls:
      net.ipv4.ip_forward: '1'
    extra_hosts:
    - host-b:10.91.2.10
    volumes:
    - ./appliances/r1/base.txt:/iol/base.txt:ro
    - ./appliances/r1/NETMAP:/iol/NETMAP:ro
    - ./appliances/r1/iouyap.ini:/iol/iouyap.ini:ro
    - ../../configs/r1.cfg:/iol/own.txt:ro
    entrypoint:
    - /bin/sh
    - -c
    - cat /iol/base.txt /iol/own.txt > /iol/config.txt 2>/dev/null; echo end >> /iol/config.txt; exec /entrypoint.sh
    environment:
      IOL_PID: '1'
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  r1-routes:
    image: alpine:3.20
    network_mode: service:r1
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip addr flush dev eth1 && ip addr flush dev eth2 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip -o -4 addr show | grep -q '' eth[1-9]'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      r1:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  r2:
    image: vrnetlab/cisco_iol:17.12.01
    platform: linux/amd64
    hostname: r2
    networks:
      isoloom-mgmt:
        ipv4_address: 10.255.255.11
        interface_name: eth0
        priority: 1000
      site-b:
        ipv4_address: 10.91.2.1
        interface_name: eth1
        priority: 999
      wan:
        ipv4_address: 10.91.0.3
        interface_name: eth2
        priority: 998
    cap_add:
    - NET_ADMIN
    - NET_RAW
    sysctls:
      net.ipv4.ip_forward: '1'
    extra_hosts:
    - host-a:10.91.1.10
    volumes:
    - ./appliances/r2/base.txt:/iol/base.txt:ro
    - ./appliances/r2/NETMAP:/iol/NETMAP:ro
    - ./appliances/r2/iouyap.ini:/iol/iouyap.ini:ro
    - ../../configs/r2.cfg:/iol/own.txt:ro
    entrypoint:
    - /bin/sh
    - -c
    - cat /iol/base.txt /iol/own.txt > /iol/config.txt 2>/dev/null; echo end >> /iol/config.txt; exec /entrypoint.sh
    environment:
      IOL_PID: '2'
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  r2-routes:
    image: alpine:3.20
    network_mode: service:r2
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip addr flush dev eth1 && ip addr flush dev eth2 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip -o -4 addr show | grep -q '' eth[1-9]'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      r2:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  host-a:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: host-a
    networks:
      site-a:
        ipv4_address: 10.91.1.10
    extra_hosts:
    - r2:10.91.2.1
    - host-b:10.91.2.10
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  host-a-routes:
    image: alpine:3.20
    network_mode: service:host-a
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace default via 10.91.1.1 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - ip route | grep -q '^default via 10.91.1.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      host-a:
        condition: service_started
      r1:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  host-b:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: host-b
    networks:
      site-b:
        ipv4_address: 10.91.2.10
    extra_hosts:
    - r1:10.91.1.1
    - host-a:10.91.1.10
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.80: http:80
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
    restart: unless-stopped
  host-b-routes:
    image: alpine:3.20
    network_mode: service:host-b
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace default via 10.91.2.1 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - ip route | grep -q '^default via 10.91.2.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      host-b:
        condition: service_started
      r2:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  isoloom-check-host-a:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/host-a.sh:/isoloom/run.sh:ro
    network_mode: service:host-a
    depends_on:
      r1-routes:
        condition: service_healthy
      r2-routes:
        condition: service_healthy
      host-a-routes:
        condition: service_healthy
      host-b:
        condition: service_healthy
      host-b-routes:
        condition: service_healthy
      host-a:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
networks:
  site-a:
    ipam:
      config:
      - subnet: 10.91.1.0/24
        gateway: 10.91.1.254
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  site-b:
    ipam:
      config:
      - subnet: 10.91.2.0/24
        gateway: 10.91.2.254
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  wan:
    ipam:
      config:
      - subnet: 10.91.0.0/29
        gateway: 10.91.0.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
  isoloom-mgmt:
    ipam:
      config:
      - subnet: 10.255.255.0/24
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: cisco-iol
