# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Two sites, each behind a Cisco IOL router, joined by a WAN; the routers learn each other's LAN
# with OSPF (their own configuration, added to the one Isoloom generates). IOL comes from Cisco
# Modeling Labs and isn't Isoloom's to ship: build the image with vrnetlab (cisco/iol) from a
# release you're licensed for, then set its tag below.
version: 1
name: cisco-iol

networks:
  site-a: { cidr: 10.91.1.0/24, gateway: r1 }
  site-b: { cidr: 10.91.2.0/24, gateway: r2 }
  wan:    { cidr: 10.91.0.0/29, internet: false }

machines:
  r1:
    networks: { site-a: 1, wan: 2 }
    docker:
      image: "vrnetlab/cisco_iol:17.12.01"
      appliance: cisco-iol
      config: configs/r1.cfg

  r2:
    networks: { site-b: 1, wan: 3 }
    docker:
      image: "vrnetlab/cisco_iol:17.12.01"
      appliance: cisco-iol
      config: configs/r2.cfg

  host-a:
    networks: { site-a: 10 }
    docker: { image: "alpine:3.20", idle: true }

  host-b:
    networks: { site-b: 10 }
    services: [{ port: 80, http: true }]
    docker: { image: "nginx:1.27-alpine" }

checks:
  - name: site A reaches site B through both routers
    from: host-a
    http: http://host-b/
    expect: 200
    wait: 180
