# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# The containers of a hybrid environment: run on the isoloom-docker VM, on the networks it
# creates there (macvlan, shared with the VMs). Started by the Vagrantfile next to it.

name: mixed-office
services:
  intranet:
    image: nginx:1.27
    platform: linux/amd64
    hostname: intranet
    networks:
      office:
        ipv4_address: 192.168.58.20
        gw_priority: 1
      isoloom-publish: null
    extra_hosts:
    - files01:192.168.58.10
    ports:
    - 8083:80
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.80: http:80
      isoloom.managed: 'true'
      isoloom.environment: mixed-office
    restart: unless-stopped
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    network_mode: none
    volumes:
    - isoloom-probe-amd64:/probe
    labels:
      isoloom.managed: 'true'
      isoloom.environment: mixed-office
    restart: no
networks:
  isoloom-publish: {}
  office:
    external: true
    name: isoloom-mixed-office-office
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: mixed-office
