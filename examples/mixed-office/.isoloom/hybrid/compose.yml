# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# The containers of a hybrid environment: run on the isoloom-docker VM, on the networks it
# creates there (macvlan, shared with the VMs). Started by the Vagrantfile next to it.

name: mixed-office
services:
  intranet:
    image: nginx:1.27
    platform: linux/amd64
    hostname: intranet
    networks:
      office:
        ipv4_address: 192.168.58.20
        gw_priority: 1
      isoloom-publish: null
    ports:
    - 8083:80
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
    extra_hosts:
    - files01:192.168.58.10
networks:
  isoloom-publish: null
  office:
    external: true
    name: isoloom-mixed-office-office
