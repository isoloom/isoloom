# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# A web server and a cache, as containers or as native VMs, with the same behavior:
# the page answers on web:80, the cache holds the greeting seeded at start, and nothing
# reaches the internet.
version: 1
name: hello-stack

networks:
  app: { cidr: 10.60.0.0/24, internet: false }

machines:
  cache:
    networks: { app: 20 }
    services: [{ port: 6379, name: redis }]
    volumes: { data: /data }
    docker:
      image: "redis:7-alpine"
      init: [build/cache/seed.sh]
    vm:
      os: debian-12
      provision: [provision/cache.sh]

  web:
    networks: { app: 10 }
    services: [{ port: 80, http: true, publish: 8080 }]
    depends_on: [cache]
    docker:
      build: build/web
    vm:
      os: debian-12
      provision: [provision/web.sh]

checks:
  - checks/cache-seeded.sh
  - name: the page greets
    http: http://web/
    expect: 200
  - name: the cache holds the greeting, read inside it
    from: cache
    exec: redis-cli get greeting
    expect: hello from isoloom
  - name: the cache answers a PING
    tcp: cache:6379
    send: PING
    contains: +PONG
  - name: the page says hello
    http: http://web/
    headers: { Accept: text/html }
    contains: hello from isoloom
  - name: the static page refuses a POST
    http: http://web/
    method: POST
    body: "greeting=hi"
    expect: 405

message: |
  The page answers at http://localhost:{{ machines.web.services.0.publish }}/ (and at
  http://web/ from inside). The cache at {{ machines.cache.addresses.app }}:6379 holds the
  greeting seeded at start; nothing here reaches the internet.
