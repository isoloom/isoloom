# Start:  kubectl kustomize --load-restrictor LoadRestrictionsNone .isoloom/kubernetes | kubectl apply -f -
#         kubectl -n isoloom-hello-stack wait --for=condition=Available deployment --all --timeout=600s
# Stop:   kubectl delete namespace isoloom-hello-stack
# Images built from the project, before starting (a local cluster sharing Docker's images:
# OrbStack, Docker Desktop; elsewhere, push them to a registry the cluster pulls from):
#   docker build -t isoloom/hello-stack-web build/web

apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-hello-stack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: cache
  template:
    metadata:
      labels:
        isoloom.com/machine: cache
        net.isoloom.com/app: member
    spec:
      hostname: cache
      containers:
      - name: cache
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - (nc -z 127.0.0.1 6379 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/6379' 2>/dev/null)
          periodSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: vol-data
          mountPath: /data
      - name: init
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until (nc -z 127.0.0.1 6379 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/6379' 2>/dev/null); do sleep 2; done && sh /isoloom/scripts/build__cache__seed.sh && exec sleep infinity
        volumeMounts:
        - name: vol-data
          mountPath: /data
        - name: scripts
          mountPath: /isoloom/scripts
      volumes:
      - name: vol-data
        persistentVolumeClaim:
          claimName: cache-data
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector:
    isoloom.com/machine: cache
  ports:
  - name: p6379
    port: 6379
    targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offline-cache
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: cache
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: web
  template:
    metadata:
      labels:
        isoloom.com/machine: web
        net.isoloom.com/app: member
    spec:
      hostname: web
      initContainers:
      - name: wait-cache
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z cache 6379; do sleep 2; done
      containers:
      - name: web
        image: isoloom/hello-stack-web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
          periodSeconds: 5
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    isoloom.com/machine: web
  ports:
  - name: p80
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-published
spec:
  type: LoadBalancer
  selector:
    isoloom.com/machine: web
  ports:
  - name: p8080
    port: 8080
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publish-web
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: web
  ingress:
