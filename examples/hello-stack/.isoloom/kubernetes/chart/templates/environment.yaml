# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: cache
  template:
    metadata:
      labels:
        isoloom.com/machine: cache
        net.isoloom.com/app: member
    spec:
      hostname: cache
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      - name: seed-data
        image: {{ index .Values.images "cache" | quote }}
        imagePullPolicy: IfNotPresent
        command:
        - /.isoloom-probe/busybox
        - sh
        - -c
        - 'd=/isoloom-seed; m="$d/.isoloom-seeding"; b=/.isoloom-probe/busybox; [ -d ''/data'' ] || exit 0; for f in "$d"/* "$d"/.[!.]* "$d"/..?*; do if [ -e "$f" ] || [ -L "$f" ]; then case "$f" in "$d/lost+found" | "$m") ;; *) [ -e "$m" ] || exit 0; $b rm -rf "$f" ;; esac; fi; done; : > "$m" && $b cp -a ''/data/.'' "$d/" && $b rm -f "$m"'
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: vol-data
          mountPath: /isoloom-seed
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      containers:
      - name: cache
        image: {{ index .Values.images "cache" | quote }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 6379
          periodSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: vol-data
          mountPath: /data
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      - name: init
        image: {{ index .Values.images "cache" | quote }}
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 6379; do sleep 2; done && sh /isoloom/scripts/build__cache__seed.sh && exec sleep infinity
        volumeMounts:
        - name: vol-data
          mountPath: /data
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
        - name: scripts
          mountPath: /isoloom/scripts
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: vol-data
        persistentVolumeClaim:
          claimName: cache-data
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
      - name: isoloom-probe
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector:
    isoloom.com/machine: cache
  ports:
  - name: p6379
    port: 6379
    targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offline-cache
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: cache
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
