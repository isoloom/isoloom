# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# The environment's checks, from the access machine's networks. Run after the environment:
#   kubectl -n isoloom-hello-stack delete job isoloom-check --ignore-not-found
#   kubectl kustomize --load-restrictor LoadRestrictionsNone .isoloom/kubernetes/checks | kubectl apply -f -
#   kubectl -n isoloom-hello-stack wait --for=condition=complete job/isoloom-check --timeout=300s; kubectl -n isoloom-hello-stack logs job/isoloom-check
apiVersion: batch/v1
kind: Job
metadata:
  name: isoloom-check
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        net.isoloom.com/app: member
        isoloom.com/check: runner
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: curlimages/curl:8.11.1
        command:
        - /bin/sh
        - -c
        - echo '== checks/web-answers.sh' && sh /isoloom/scripts/checks__web-answers.sh && echo '== checks/cache-seeded.sh' && sh /isoloom/scripts/checks__cache-seeded.sh && echo '== checks/no-internet.sh' && sh /isoloom/scripts/checks__no-internet.sh
        volumeMounts:
        - name: scripts
          mountPath: /isoloom/scripts
      volumes:
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
