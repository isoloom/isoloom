# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: isoloom-hello-stack
resources:
  - environment.yaml
# The project's scripts the pods run (init jobs, checks), read from the project at apply time.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: isoloom-scripts
    files:
      - build__cache__seed.sh=../../build/cache/seed.sh
      - checks__cache-seeded.sh=../../checks/cache-seeded.sh
      - checks__no-internet.sh=../../checks/no-internet.sh
      - checks__web-answers.sh=../../checks/web-answers.sh
