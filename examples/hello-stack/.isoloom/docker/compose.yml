# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: hello-stack
services:
  cache:
    image: redis:7-alpine
    hostname: cache
    networks:
      app:
        ipv4_address: 10.60.0.20
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 6379 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/6379' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
  cache-init-1:
    image: redis:7-alpine
    entrypoint:
    - /bin/sh
    - /isoloom/init/seed.sh
    volumes:
    - ../../build/cache/seed.sh:/isoloom/init/seed.sh:ro
    network_mode: service:cache
    depends_on:
      cache:
        condition: service_healthy
    restart: no
  web:
    build:
      context: ../../build/web
    image: isoloom/hello-stack-web
    hostname: web
    networks:
      app:
        ipv4_address: 10.60.0.10
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      cache:
        condition: service_healthy
      cache-init-1:
        condition: service_completed_successfully
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - echo '== checks/web-answers.sh' && sh /isoloom/checks/01-web-answers.sh && echo '== checks/cache-seeded.sh' && sh /isoloom/checks/02-cache-seeded.sh && echo '== checks/no-internet.sh' && sh /isoloom/checks/03-no-internet.sh
    volumes:
    - ../../checks/web-answers.sh:/isoloom/checks/01-web-answers.sh:ro
    - ../../checks/cache-seeded.sh:/isoloom/checks/02-cache-seeded.sh:ro
    - ../../checks/no-internet.sh:/isoloom/checks/03-no-internet.sh:ro
    networks:
      app: null
    depends_on:
      cache:
        condition: service_healthy
      cache-init-1:
        condition: service_completed_successfully
      web:
        condition: service_healthy
networks:
  app:
    ipam:
      config:
      - subnet: 10.60.0.0/24
        gateway: 10.60.0.1
    internal: true
