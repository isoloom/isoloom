# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: hello-stack
services:
  cache:
    image: redis:7-alpine
    platform: linux/amd64
    hostname: cache
    networks:
      app:
        ipv4_address: 10.60.0.20
    volumes:
    - cache-data:/data
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 6379
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.redis: tcp:6379
    restart: unless-stopped
  cache-routes:
    image: alpine:3.20
    network_mode: service:cache
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      cache:
        condition: service_started
    restart: unless-stopped
  cache-init-1:
    image: redis:7-alpine
    entrypoint:
    - /bin/sh
    - /isoloom/init/seed.sh
    volumes:
    - ../../build/cache/seed.sh:/isoloom/init/seed.sh:ro
    - cache-data:/data
    network_mode: service:cache
    depends_on:
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
    restart: no
  web:
    build:
      context: ../../build/web
    image: isoloom/hello-stack-web
    platform: linux/amd64
    hostname: web
    networks:
      app:
        ipv4_address: 10.60.0.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8080}:80
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      cache-init-1:
        condition: service_completed_successfully
      cache-routes:
        condition: service_healthy
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  web-routes:
    image: alpine:3.20
    network_mode: service:web
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      app: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      cache:
        condition: service_healthy
      cache-init-1:
        condition: service_completed_successfully
      cache-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
  isoloom-check-cache:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/cache.sh:/isoloom/run.sh:ro
    network_mode: service:cache
    depends_on:
      cache:
        condition: service_healthy
      cache-init-1:
        condition: service_completed_successfully
      cache-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
  isoloom-check-web:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/web.sh:/isoloom/run.sh:ro
    network_mode: service:web
    depends_on:
      cache:
        condition: service_healthy
      cache-init-1:
        condition: service_completed_successfully
      cache-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  app:
    ipam:
      config:
      - subnet: 10.60.0.0/24
        gateway: 10.60.0.1
volumes:
  cache-data: {}
  isoloom-probe-amd64: {}
