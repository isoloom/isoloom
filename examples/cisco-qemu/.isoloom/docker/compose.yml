# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: cisco-qemu
services:
  vios:
    image: vrnetlab/cisco_vios:15.9.3M6
    platform: linux/amd64
    hostname: vios
    networks:
      isoloom-mgmt:
        ipv4_address: 10.255.255.10
        interface_name: eth0
        priority: 1000
      site-a:
        ipv4_address: 10.92.1.1
        interface_name: eth1
        priority: 999
      wan:
        ipv4_address: 10.92.0.2
        interface_name: eth2
        priority: 998
    cap_add:
    - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
    extra_hosts:
    - host-b:10.92.2.10
    volumes:
    - ./appliances/vios/base.cfg:/config/base.cfg:ro
    - ../../configs/vios.cfg:/config/own.cfg:ro
    entrypoint:
    - /bin/sh
    - -c
    - cat /config/base.cfg /config/own.cfg > /config/startup-config.cfg 2>/dev/null; echo end >> /config/startup-config.cfg; exec uv run /launch.py --username admin --password admin --hostname vios --connection-mode tc --trace
    environment:
      CLAB_INTFS: '2'
      CONNECTION_MODE: tc
      CLAB_MGMT_PASSTHROUGH: 'true'
    privileged: true
    restart: unless-stopped
  vios-routes:
    image: alpine:3.20
    network_mode: service:vios
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip addr flush dev eth1 && ip addr flush dev eth2 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip -o -4 addr show | grep -q '' eth[1-9]'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      vios:
        condition: service_started
    restart: unless-stopped
  csr:
    image: vrnetlab/cisco_csr1000v:17.03.08
    platform: linux/amd64
    hostname: csr
    networks:
      isoloom-mgmt:
        ipv4_address: 10.255.255.11
        interface_name: eth0
        priority: 1000
      site-b:
        ipv4_address: 10.92.2.1
        interface_name: eth1
        priority: 999
      wan:
        ipv4_address: 10.92.0.3
        interface_name: eth2
        priority: 998
    cap_add:
    - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
    extra_hosts:
    - host-a:10.92.1.10
    volumes:
    - ./appliances/csr/base.cfg:/config/base.cfg:ro
    - ../../configs/csr.cfg:/config/own.cfg:ro
    entrypoint:
    - /bin/sh
    - -c
    - cat /config/base.cfg /config/own.cfg > /config/startup-config.cfg 2>/dev/null; echo end >> /config/startup-config.cfg; exec uv run /launch.py --username admin --password admin --hostname csr --connection-mode tc --trace
    environment:
      CLAB_INTFS: '2'
      CONNECTION_MODE: tc
    privileged: true
    restart: unless-stopped
  csr-routes:
    image: alpine:3.20
    network_mode: service:csr
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip addr flush dev eth1 && ip addr flush dev eth2 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip -o -4 addr show | grep -q '' eth[1-9]'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      csr:
        condition: service_started
    restart: unless-stopped
  host-a:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: host-a
    networks:
      site-a:
        ipv4_address: 10.92.1.10
    extra_hosts:
    - csr:10.92.2.1
    - host-b:10.92.2.10
    restart: unless-stopped
  host-a-routes:
    image: alpine:3.20
    network_mode: service:host-a
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace default via 10.92.1.1 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route | grep -q '^default via 10.92.1.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      host-a:
        condition: service_started
      vios:
        condition: service_started
    restart: unless-stopped
  host-b:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: host-b
    networks:
      site-b:
        ipv4_address: 10.92.2.10
    extra_hosts:
    - vios:10.92.1.1
    - host-a:10.92.1.10
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  host-b-routes:
    image: alpine:3.20
    network_mode: service:host-b
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace default via 10.92.2.1 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route | grep -q '^default via 10.92.2.1 '
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      host-b:
        condition: service_started
      csr:
        condition: service_started
    restart: unless-stopped
  isoloom-check-host-a:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/host-a.sh:/isoloom/run.sh:ro
    network_mode: service:host-a
    depends_on:
      vios-routes:
        condition: service_healthy
      csr-routes:
        condition: service_healthy
      host-a-routes:
        condition: service_healthy
      host-b:
        condition: service_healthy
      host-b-routes:
        condition: service_healthy
      host-a:
        condition: service_started
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  site-a:
    ipam:
      config:
      - subnet: 10.92.1.0/24
        gateway: 10.92.1.254
  site-b:
    ipam:
      config:
      - subnet: 10.92.2.0/24
        gateway: 10.92.2.254
  wan:
    ipam:
      config:
      - subnet: 10.92.0.0/29
        gateway: 10.92.0.1
  isoloom-mgmt:
    ipam:
      config:
      - subnet: 10.255.255.0/24
volumes:
  isoloom-probe-amd64: {}
