hostname vios
!
no ip domain lookup
ip domain name lab
!
username admin privilege 15 secret admin
!
interface GigabitEthernet0/1
 description site-a
 ip address 10.92.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description wan
 ip address 10.92.0.2 255.255.255.248
 no shutdown
!
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh telnet
!
