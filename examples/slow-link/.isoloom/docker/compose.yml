# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: slow-link
services:
  isoloom-router:
    image: alpine:3.20
    hostname: isoloom-router
    cap_add:
    - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
    networks:
      branch:
        ipv4_address: 10.75.1.254
      far:
        ipv4_address: 10.75.2.254
    environment:
      RULES: |
        table inet isoloom {
          chain forward {
            type filter hook forward priority 0; policy drop;
            ct state established,related accept
            ip saddr 10.75.1.0/24 ip daddr 10.75.2.0/24 meta l4proto { tcp, udp } th dport { 80 } accept
            ip saddr 10.75.1.0/24 ip daddr 10.75.2.0/24 icmp type echo-request accept
          }
        }
      TC: |
        IF=$$(ip -o -4 addr show | awk '$$4 ~ /^10\.75\.2\.254\//{print $$2}' | head -n 1); [ -n "$$IF" ] && tc qdisc replace dev "$$IF" root netem delay 80ms 10ms loss 1% rate 10mbit
    entrypoint:
    - /bin/sh
    - -c
    - apk add --no-cache nftables iproute2 >/dev/null && printf '%s' "$$RULES" | nft -f - && printf '%s' "$$TC" | sh && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - nft list table inet isoloom >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  web:
    build:
      context: ../../build/web
    image: isoloom/slow-link-web
    platform: linux/amd64
    hostname: web
    networks:
      far:
        ipv4_address: 10.75.2.10
    extra_hosts:
    - user:10.75.1.10
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  web-routes:
    image: alpine:3.20
    network_mode: service:web
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.75.1.0/24 via 10.75.2.254 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.75.1.0/24 | grep -q via
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      web:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
  isoloom-access:
    image: alpine:3.20
    hostname: user
    networks:
      branch:
        ipv4_address: 10.75.1.10
    extra_hosts:
    - web:10.75.2.10
    entrypoint:
    - sleep
    - infinity
    profiles:
    - check
  isoloom-access-routes:
    image: alpine:3.20
    network_mode: service:isoloom-access
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.75.2.0/24 via 10.75.1.254 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.75.2.0/24 | grep -q via
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      isoloom-access:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - check
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/user.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    network_mode: service:isoloom-access
    depends_on:
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
      isoloom-access:
        condition: service_started
      isoloom-access-routes:
        condition: service_healthy
  isoloom-tool-shell:
    image: nicolaka/netshoot
    hostname: shell
    entrypoint:
    - sleep
    - infinity
    cap_add:
    - NET_ADMIN
    - NET_RAW
    networks:
      branch:
        ipv4_address: 10.75.1.252
      far:
        ipv4_address: 10.75.2.252
    restart: unless-stopped
networks:
  branch:
    ipam:
      config:
      - subnet: 10.75.1.0/24
        gateway: 10.75.1.1
  far:
    ipam:
      config:
      - subnet: 10.75.2.0/24
        gateway: 10.75.2.1
