# The DMZ gateway as a VM: the same page and SSH as the container.
- hosts: all
  become: true
  tasks:
    - name: nginx and SSH
      ansible.builtin.apt: { name: [nginx, openssh-server], update_cache: true }
    - name: The gateway's page
      ansible.builtin.copy: { src: "{{ playbook_dir }}/../build/gateway/index.html", dest: /var/www/html/index.html, mode: "0644" }
