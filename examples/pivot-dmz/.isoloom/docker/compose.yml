# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: pivot-dmz
services:
  isoloom-router:
    image: alpine:3.20
    hostname: isoloom-router
    cap_add:
    - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
    networks:
      dmz:
        ipv4_address: 10.30.10.254
      internal:
        ipv4_address: 10.30.20.254
      access:
        ipv4_address: 10.30.99.254
    environment:
      RULES: |
        table inet isoloom {
          chain forward {
            type filter hook forward priority 0; policy drop;
            ct state established,related accept
            ip saddr 10.30.99.0/24 ip daddr 10.30.10.0/24 accept
            ip saddr 10.30.10.0/24 ip daddr 10.30.20.0/24 meta l4proto { tcp, udp } th dport { 8080, 5432 } accept
            ip saddr 10.30.10.0/24 ip daddr 10.30.20.0/24 icmp type echo-request accept
          }
        }
    entrypoint:
    - /bin/sh
    - -c
    - apk add --no-cache nftables >/dev/null && printf '%s' "$$RULES" | nft -f - && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - nft list table inet isoloom >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  gateway:
    build:
      context: ../../build/gateway
    image: isoloom/pivot-dmz-gateway
    platform: linux/amd64
    hostname: gateway
    networks:
      dmz:
        ipv4_address: 10.30.10.10
      internal:
        ipv4_address: 10.30.20.10
    extra_hosts:
    - user:10.30.99.10
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 22
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.80: tcp:80
      isoloom.service.22: tcp:22
    restart: unless-stopped
  gateway-routes:
    image: alpine:3.20
    network_mode: service:gateway
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.30.99.0/24 via 10.30.10.254 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.30.99.0/24 | grep -q via
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      gateway:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
  app:
    build:
      context: ../../build/app
    image: isoloom/pivot-dmz-app
    platform: linux/amd64
    hostname: app
    networks:
      internal:
        ipv4_address: 10.30.20.20
    extra_hosts:
    - user:10.30.99.10
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8080
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.8080: tcp:8080
    restart: unless-stopped
  app-routes:
    image: alpine:3.20
    network_mode: service:app
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.30.10.0/24 via 10.30.20.254 && ip route replace 10.30.99.0/24 via 10.30.20.254 && (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.30.10.0/24 | grep -q via && ! ip route | grep -q '^default'
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      app:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16
    platform: linux/amd64
    hostname: db
    networks:
      internal:
        ipv4_address: 10.30.20.30
    extra_hosts:
    - user:10.30.99.10
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 5432
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.5432: tcp:5432
    restart: unless-stopped
  db-routes:
    image: alpine:3.20
    network_mode: service:db
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.30.10.0/24 via 10.30.20.254 && ip route replace 10.30.99.0/24 via 10.30.20.254 && (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.30.10.0/24 | grep -q via && ! ip route | grep -q '^default'
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      db:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
  isoloom-access:
    image: alpine:3.20
    hostname: user
    networks:
      access:
        ipv4_address: 10.30.99.10
    extra_hosts:
    - gateway:10.30.10.10
    - app:10.30.20.20
    - db:10.30.20.30
    entrypoint:
    - sleep
    - infinity
    profiles:
    - check
  isoloom-access-routes:
    image: alpine:3.20
    network_mode: service:isoloom-access
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.30.10.0/24 via 10.30.99.254 && ip route replace 10.30.20.0/24 via 10.30.99.254 && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.30.10.0/24 | grep -q via
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      isoloom-access:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - check
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/user.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    network_mode: service:isoloom-access
    depends_on:
      gateway:
        condition: service_healthy
      gateway-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
      isoloom-access:
        condition: service_started
      isoloom-access-routes:
        condition: service_healthy
  isoloom-check-gateway:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/gateway.sh:/isoloom/run.sh:ro
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
      gateway-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
  isoloom-check-app:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/app.sh:/isoloom/run.sh:ro
    network_mode: service:app
    depends_on:
      gateway:
        condition: service_healthy
      gateway-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
  isoloom-check-db:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/db.sh:/isoloom/run.sh:ro
    network_mode: service:db
    depends_on:
      gateway:
        condition: service_healthy
      gateway-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  dmz:
    ipam:
      config:
      - subnet: 10.30.10.0/24
        gateway: 10.30.10.1
  internal:
    ipam:
      config:
      - subnet: 10.30.20.0/24
        gateway: 10.30.20.1
  access:
    ipam:
      config:
      - subnet: 10.30.99.0/24
        gateway: 10.30.99.1
volumes:
  isoloom-probe-amd64: {}
