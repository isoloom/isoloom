# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: udp-dns
services:
  isoloom-router:
    image: alpine:3.20
    sysctls:
      net.ipv4.ip_forward: '1'
    entrypoint:
    - /bin/sh
    - -c
    - apk add --no-cache nftables >/dev/null && printf '%s' "$$RULES" | nft -f - && exec sleep infinity
    hostname: isoloom-router
    networks:
      servers:
        ipv4_address: 10.66.10.254
      users:
        ipv4_address: 10.66.20.254
    cap_add:
    - NET_ADMIN
    environment:
      RULES: |
        table inet isoloom {
          chain forward {
            type filter hook forward priority 0; policy drop;
            ct state established,related accept
            ip saddr 10.66.20.0/24 ip daddr 10.66.10.0/24 meta l4proto { tcp, udp } th dport { 53 } accept
            ip saddr 10.66.20.0/24 ip daddr 10.66.10.0/24 icmp type echo-request accept
          }
        }
    healthcheck:
      test:
      - CMD-SHELL
      - nft list table inet isoloom >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 60
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
    restart: unless-stopped
  dns:
    build:
      context: ../../build/dns
      labels:
        isoloom.managed: 'true'
        isoloom.environment: udp-dns
    image: isoloom/udp-dns-dns
    platform: linux/amd64
    hostname: dns
    networks:
      servers:
        ipv4_address: 10.66.10.53
    extra_hosts:
    - client:10.66.20.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+10053}:53/udp
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 53
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.dns-udp: udp:53
      isoloom.service.dns: tcp:53
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
    restart: unless-stopped
  dns-routes:
    image: alpine:3.20
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.66.20.0/24 via 10.66.10.254 && (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    network_mode: service:dns
    cap_add:
    - NET_ADMIN
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.66.20.0/24 | grep -q via && ! ip route | grep -q '^default'
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      dns:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
    restart: unless-stopped
  client:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: client
    networks:
      users:
        ipv4_address: 10.66.20.10
    extra_hosts:
    - dns:10.66.10.53
    depends_on:
      dns:
        condition: service_healthy
      dns-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
    restart: unless-stopped
  client-routes:
    image: alpine:3.20
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.66.10.0/24 via 10.66.20.254 && (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    network_mode: service:client
    cap_add:
    - NET_ADMIN
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.66.10.0/24 | grep -q via && ! ip route | grep -q '^default'
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      client:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:client
    volumes:
    - ./checks/client.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    depends_on:
      dns:
        condition: service_healthy
      dns-routes:
        condition: service_healthy
      client-routes:
        condition: service_healthy
      client:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
  isoloom-check-dns:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:dns
    volumes:
    - ./checks/dns.sh:/isoloom/run.sh:ro
    depends_on:
      dns:
        condition: service_healthy
      dns-routes:
        condition: service_healthy
      client-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    network_mode: none
    volumes:
    - isoloom-probe-amd64:/probe
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
    restart: no
networks:
  servers:
    ipam:
      config:
      - subnet: 10.66.10.0/24
        gateway: 10.66.10.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
  users:
    ipam:
      config:
      - subnet: 10.66.20.0/24
        gateway: 10.66.20.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: udp-dns
