          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: client
  template:
    metadata:
      labels:
        isoloom.com/machine: client
        net.isoloom.com/users: member
    spec:
      hostname: client
      initContainers:
      - name: wait-dns
        image: {{ index .Values.images "client" | quote }}
        command:
        - sh
        - -c
        - until nc -z dns 53; do sleep 2; done
      containers:
      - name: client
        image: {{ index .Values.images "client" | quote }}
        imagePullPolicy: IfNotPresent
        command:
        - sleep
        - infinity
      nodeSelector:
        kubernetes.io/arch: amd64
