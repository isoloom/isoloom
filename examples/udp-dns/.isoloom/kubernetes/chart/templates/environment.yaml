apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: dns
  template:
    metadata:
      labels:
        isoloom.com/machine: dns
        net.isoloom.com/servers: member
    spec:
      hostname: dns
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: dns
        image: {{ index .Values.images "dns" | quote }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 53
          protocol: UDP
        - containerPort: 53
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 53
          periodSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: isoloom-probe
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dns
spec:
  selector:
    isoloom.com/machine: dns
  ports:
  - name: p53-udp
    port: 53
    targetPort: 53
    protocol: UDP
  - name: p53
    port: 53
    targetPort: 53
---
apiVersion: v1
kind: Service
metadata:
  name: dns-published
spec:
  type: LoadBalancer
  selector:
    isoloom.com/machine: dns
  ports:
  - name: p10053-udp
    port: 10053
    targetPort: 53
    protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publish-dns
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: dns
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 53
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offline-dns
spec:
  podSelector:
    matchLabels:
