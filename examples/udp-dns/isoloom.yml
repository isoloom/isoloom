# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# A DNS server on its own network, as a container or a VM: it answers over UDP (queries) and
# TCP (large answers, zone transfers). The client's network may reach it on port 53 only, and
# `reach` opens that port for both protocols. Nothing waits on UDP (it has no handshake) and no
# derived check probes it: the client's own check resolves a name through it.
version: 1
name: udp-dns

networks:
  servers: { cidr: 10.66.10.0/24, internet: false }
  users:   { cidr: 10.66.20.0/24, internet: false }

reach:
  - { from: users, to: servers, ports: [53] }

machines:
  dns:
    networks: { servers: 53 }
    services:
      - { port: 53, protocol: udp, name: dns, publish: 10053 }
      - { port: 53, name: dns-tcp }
    docker:
      build: build/dns
    vm:
      os: debian-12
      provision: [provision/dns.sh]

  client:
    access: true
    networks: { users: 10 }
    depends_on: [dns]
    docker:
      image: "alpine:3.20"
      idle: true
    vm:
      os: debian-12
      provision: [provision/client.sh]

checks:
  - checks/resolve.sh

message: |
  The DNS server answers at {{ machines.dns.addresses.servers }}:53 (UDP and TCP), and on
  127.0.0.1:{{ machines.dns.services.0.publish }}/udp from this machine:
  dig @127.0.0.1 -p {{ machines.dns.services.0.publish }} www.lab.test
