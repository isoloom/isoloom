# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# A shop and the platform services it uses (`services:`, the `paas` feature, a draft): its
# PostgreSQL database, a bucket and Kafka. One spec: on containers and on a server each service
# is a machine of its own (the official postgres image or a Debian VM; SeaweedFS's S3 server;
# Apache Kafka), on AWS, Azure and Google Cloud the cloud's own managed service. The shop reads
# the same variables and files everywhere: the database at db.shop.internal (the services turn
# the private zone on), its password as a file; the bucket's and the brokers' facts as files
# under /etc/isoloom/services/, which a cloud delivers once it has made them, after the shop's
# own set-up. So the shop waits for a fact's file, with a timeout, before it reads it:
#
#   sh "$STORAGE_WAIT" "$STORAGE_BUCKET_FILE" 300 && bucket=$(cat "$STORAGE_BUCKET_FILE")
#   sh "$BUS_WAIT" "$BUS_BOOTSTRAP_FILE" 300 && brokers=$(cat "$BUS_BOOTSTRAP_FILE")
#
# Not one of the examples every target generates: it needs Isoloom built with `--features paas`.
version: 1
name: shop

networks:
  lab: { cidr: 10.30.0.0/24 }

inputs:
  # The player's own address: the database is published to it alone.
  PLAYER_IP: { sensitive: false, description: "Who may reach the published database, e.g. 203.0.113.7/32." }

secrets:
  db-password: { env: SHOP_DB_PASSWORD }
  files-key: { env: SHOP_FILES_KEY }
  files-secret: { env: SHOP_FILES_SECRET }
  bus-user: { env: SHOP_BUS_USER }
  bus-password: { env: SHOP_BUS_PASSWORD }

machines:
  web:
    os: debian@12
    networks: { lab: 10 }
    ports:
      shop: { port: 80, protocol: http, publish: 8080 }
    resources: { cpus: 1, memory_mb: 1024 }
    app:
      steps: [{ packages: [nginx, postgresql-client] }, { service: nginx }]

services:
  db:
    kind: postgres
    version: "16"
    networks: { lab: 40 }       # its address where it runs as a machine; a cloud picks its own
    database: shop
    user: shop
    password: db-password
    publish: { allow: PLAYER_IP }
    # DATABASE_HOST, _PORT, _NAME, _USER, _SSLMODE, and _PASSWORD_FILE (the secret, as a file).
    clients: { web: { env_prefix: DATABASE } }

  files:
    kind: object-storage
    bucket: uploads
    api: platform               # each platform's own API (Azure has no S3): STORAGE_API_FILE says which
    networks: { lab: 41 }
    credentials: { access_key: files-key, secret_key: files-secret }
    # STORAGE_AUTH, STORAGE_WAIT (the wait helper), and STORAGE_ENDPOINT_FILE, _BUCKET_FILE, _REGION_FILE, _API_FILE,
    # _ACCESS_KEY_FILE, _SECRET_KEY_FILE. `access: identity` instead gives a cloud client its
    # platform identity and no key (refused off the clouds).
    clients: { web: { env_prefix: STORAGE } }

  bus:
    kind: kafka
    networks: { lab: 42 }
    # One partition count for all (MSK makes every topic with one), none compacted (Event Hubs
    # Standard and MSK compact nothing), at most 32 (Event Hubs Standard).
    topics: { orders: { partitions: 3 }, audit: { partitions: 3 } }
    credentials: { user: bus-user, password: bus-password }
    # BUS_AUTH, BUS_WAIT, and BUS_BOOTSTRAP_FILE, _SECURITY_PROTOCOL_FILE, _SASL_MECHANISM_FILE, _USER_FILE,
    # _PASSWORD_FILE.
    clients: { web: {} }

checks:
  - name: the shop answers
    http: http://web/
    wait: 1m
