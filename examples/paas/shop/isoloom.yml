# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# A shop and the platform services it uses (`services:`, the `paas` feature, a draft): its
# PostgreSQL database and a bucket. One spec: on containers the database is the official image
# and the bucket an S3 server's container; on a VM target the database is a Debian VM; on AWS,
# Azure and Google Cloud each is the cloud's own managed service. The shop reaches the database
# at db.shop.internal on every target, with its password as a file, never a variable.
#
# Not one of the examples every target generates: it needs Isoloom built with `--features paas`.
version: 1
name: shop

# A service is reached by its name in the environment's private zone.
dns: { private: true }

networks:
  lab: { cidr: 10.30.0.0/24 }

secrets:
  db-password: { env: SHOP_DB_PASSWORD }
  files-key: { env: SHOP_FILES_KEY }
  files-secret: { env: SHOP_FILES_SECRET }

machines:
  web:
    os: debian@12
    networks: { lab: 10 }
    ports:
      shop: { port: 80, protocol: http, publish: 8080 }
    resources: { cpus: 1, memory_mb: 1024 }
    app:
      steps: [{ packages: [nginx, postgresql-client] }, { service: nginx }]

services:
  db:
    kind: postgres
    version: "16"
    networks: { lab: 40 }       # its address where it runs as a machine; a cloud picks its own
    database: shop
    user: shop
    password: db-password
    # DATABASE_HOST, _PORT, _NAME, _USER, _SSLMODE, and _PASSWORD_FILE (the secret, as a file).
    clients: { web: { env_prefix: DATABASE } }

  # Read from outside for now: a cloud bucket's name is known only once applied (the module's
  # outputs give it), so no machine is its client yet.
  files:
    kind: object-storage
    bucket: uploads
    api: platform               # Azure has no S3 API: each platform's own, so all three clouds take it
    networks: { lab: 41 }
    credentials: { access_key: files-key, secret_key: files-secret }

checks:
  - name: the shop answers
    http: http://web/
    wait: 1m
