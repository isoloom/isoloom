# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: arm-lab
services:
  web:
    image: nginx:1.27
    platform: linux/arm64
    privileged: true
    read_only: true
    shm_size: 128m
    tmpfs:
    - /run
    - /var/cache/nginx
    dns:
    - 10.60.0.2
    dns_search:
    - arm.lab
    domainname: arm.lab
    hostname: web
    networks:
      lab:
        ipv4_address: 10.60.0.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8085}:80
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-arm64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-arm64:
        condition: service_completed_successfully
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    depends_on:
      web:
        condition: service_healthy
  isoloom-probe-arm64:
    image: busybox:1.37.0-musl
    platform: linux/arm64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-arm64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.0.0/24
        gateway: 10.60.0.1
volumes:
  isoloom-probe-arm64: {}
