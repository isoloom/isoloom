# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  kubectl kustomize --load-restrictor LoadRestrictionsNone .isoloom/kubernetes | kubectl apply -f -
#         kubectl -n isoloom-arm-lab wait --for=condition=Available deployment --all --timeout=600s
# Stop:   kubectl delete namespace isoloom-arm-lab

apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-arm-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: web
  template:
    metadata:
      labels:
        isoloom.com/machine: web
        net.isoloom.com/lab: member
    spec:
      hostname: web
      containers:
      - name: web
        image: nginx:1.27
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        ports:
        - containerPort: 80
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
          periodSeconds: 5
          failureThreshold: 60
      nodeSelector:
        kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    isoloom.com/machine: web
  ports:
  - name: p80
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-published
spec:
  type: LoadBalancer
  selector:
    isoloom.com/machine: web
  ports:
  - name: p8085
    port: 8085
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publish-web
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: web
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isoloom-default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: net-lab
spec:
  podSelector:
    matchLabels:
      net.isoloom.com/lab: member
  ingress:
  - from:
    - podSelector:
        matchLabels:
          net.isoloom.com/lab: member
