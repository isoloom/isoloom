# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Three networks and a router: the user lands on `access`, may reach the web server on
# `front`, and nothing on `back`; only `front` may reach the cache, and only on 6379.
version: 1
name: segmented

networks:
  front:  { cidr: 10.61.10.0/24 }
  back:   { cidr: 10.61.20.0/24, internet: false }
  access: { cidr: 10.61.99.0/24 }

reach:
  - { from: access, to: front }
  - { from: front, to: back, ports: [6379] }

machines:
  cache:
    networks: { back: 20 }
    arch: amd64
    services: [{ port: 6379, name: redis }]
    resources: { cpus: 1, memory_mb: 1024, disk_gb: 10 }
    volumes: { data: /data }
    docker:
      image: "redis:7-alpine"
    vm:
      os: debian-12
      provision: [provision/cache.sh]

  web:
    networks: { front: 10 }
    services: [{ port: 80, http: true }]
    depends_on: [cache]
    docker:
      build: build/web
    vm:
      os: debian-12
      provision: [provision/web.sh]

  user:
    access: true
    networks: { access: 10 }
    vm:
      os: debian-12

checks:
  - name: the web page answers through the router
    from: user
    http: http://web/
    expect: 200
    wait: 60
  - name: the cache is sealed off from the user
    from: user
    tcp: cache:6379
    expect: blocked
