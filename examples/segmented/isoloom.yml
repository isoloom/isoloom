# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Three networks and a router: the user lands on `access`, may reach the web server on
# `front`, and nothing on `back`; only `front` may reach the cache, and only on 6379.
# The web server's port 4444 is the shell an exploit of its page would open: dormant, so
# nothing waits for it or expects it to answer, but `reach` still applies to it.
version: 1
name: segmented

networks:
  front:  { cidr: 10.61.10.0/24 }
  back:   { cidr: 10.61.20.0/24, internet: false }
  access: { cidr: 10.61.99.0/24 }

reach:
  - { from: access, to: front }
  - { from: front, to: back, ports: [6379] }

machines:
  cache:
    os: debian@12
    networks: { back: 20 }
    hardware: { arch: amd64 }
    ports: { redis: 6379 }
    resources: { cpus: 1, memory_mb: 1024, disk_gb: 10 }
    volumes: { data: /data }
    app:
      image: "redis:7-alpine"
      steps: [{ run: provision/cache.sh }]

  web:
    os: debian@12
    networks: { front: 10 }
    ports:
      web: { port: 80, protocol: http }
      shell: { port: 4444, dormant: true }
    depends_on: [cache]
    app:
      build: build/web
      steps: [{ run: provision/web.sh }]

  user:
    os: debian@12
    access: true
    networks: { access: 10 }

checks:
  - name: the web page answers through the router
    from: user
    http: http://web/
    expect: 200
    wait: 60
  - name: the cache is sealed off from the user
    from: user
    tcp: cache:6379
    expect: blocked
