# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# The checks: `helm test <release>` runs a Job per position (`exec` checks, run inside a machine,
# stay with `isoloom test kubernetes`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: isoloom-check-runners
data:
  user.sh: {{ .Files.Get "files/checks/user.sh" | quote }}
  cache.sh: {{ .Files.Get "files/checks/cache.sh" | quote }}
  web.sh: {{ .Files.Get "files/checks/web.sh" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: isoloom-check
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        net.isoloom.com/access: member
        isoloom.com/check: isoloom-check
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: curlimages/curl:8.11.1
        command:
        - /bin/sh
        - /isoloom/run/user.sh
        volumeMounts:
        - name: runner
          mountPath: /isoloom/run
      volumes:
      - name: runner
        configMap:
          name: isoloom-check-runners
          defaultMode: 493
---
apiVersion: batch/v1
kind: Job
metadata:
  name: isoloom-check-cache
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        net.isoloom.com/back: member
        isoloom.com/check: isoloom-check-cache
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: curlimages/curl:8.11.1
        command:
        - /bin/sh
        - /isoloom/run/cache.sh
        volumeMounts:
        - name: runner
          mountPath: /isoloom/run
      volumes:
      - name: runner
        configMap:
          name: isoloom-check-runners
          defaultMode: 493
---
apiVersion: batch/v1
kind: Job
metadata:
  name: isoloom-check-web
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        net.isoloom.com/front: member
        isoloom.com/check: isoloom-check-web
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: curlimages/curl:8.11.1
        command:
        - /bin/sh
        - /isoloom/run/web.sh
        volumeMounts:
        - name: runner
          mountPath: /isoloom/run
      volumes:
      - name: runner
        configMap:
          name: isoloom-check-runners
          defaultMode: 493
