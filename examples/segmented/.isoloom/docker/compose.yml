# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: segmented
services:
  isoloom-router:
    image: alpine:3.20
    hostname: isoloom-router
    cap_add:
    - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
    networks:
      front:
        ipv4_address: 10.61.10.254
      back:
        ipv4_address: 10.61.20.254
      access:
        ipv4_address: 10.61.99.254
    environment:
      RULES: |
        table inet isoloom {
          chain forward {
            type filter hook forward priority 0; policy drop;
            ct state established,related accept
            ip saddr 10.61.99.0/24 ip daddr 10.61.10.0/24 accept
            ip saddr 10.61.10.0/24 ip daddr 10.61.20.0/24 meta l4proto { tcp, udp } th dport { 6379 } accept
            ip saddr 10.61.10.0/24 ip daddr 10.61.20.0/24 icmp type echo-request accept
          }
        }
    entrypoint:
    - /bin/sh
    - -c
    - apk add --no-cache nftables >/dev/null && printf '%s' "$$RULES" | nft -f - && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - nft list table inet isoloom >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  cache:
    image: redis:7-alpine
    platform: linux/amd64
    hostname: cache
    networks:
      back:
        ipv4_address: 10.61.20.20
    extra_hosts:
    - web:10.61.10.10
    - user:10.61.99.10
    volumes:
    - cache-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 6379 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/6379' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.service.redis: tcp:6379
    restart: unless-stopped
  cache-routes:
    image: alpine:3.20
    network_mode: service:cache
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.61.10.0/24 via 10.61.20.254 && ip route replace 10.61.99.0/24 via 10.61.20.254 && (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.61.10.0/24 | grep -q via && ! ip route | grep -q '^default'
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      cache:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ../../build/web
    image: isoloom/segmented-web
    platform: linux/amd64
    hostname: web
    networks:
      front:
        ipv4_address: 10.61.10.10
    extra_hosts:
    - cache:10.61.20.20
    - user:10.61.99.10
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  web-routes:
    image: alpine:3.20
    network_mode: service:web
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.61.20.0/24 via 10.61.10.254 && ip route replace 10.61.99.0/24 via 10.61.10.254 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.61.20.0/24 | grep -q via
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      web:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
  isoloom-access:
    image: alpine:3.20
    hostname: user
    networks:
      access:
        ipv4_address: 10.61.99.10
    extra_hosts:
    - cache:10.61.20.20
    - web:10.61.10.10
    entrypoint:
    - sleep
    - infinity
    profiles:
    - check
  isoloom-access-routes:
    image: alpine:3.20
    network_mode: service:isoloom-access
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.61.10.0/24 via 10.61.99.254 && ip route replace 10.61.20.0/24 via 10.61.99.254 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.61.10.0/24 | grep -q via
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      isoloom-access:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - check
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/user.sh:/isoloom/run.sh:ro
    network_mode: service:isoloom-access
    depends_on:
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
      isoloom-access:
        condition: service_started
      isoloom-access-routes:
        condition: service_healthy
  isoloom-check-cache:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/cache.sh:/isoloom/run.sh:ro
    network_mode: service:cache
    depends_on:
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
  isoloom-check-web:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/web.sh:/isoloom/run.sh:ro
    network_mode: service:web
    depends_on:
      cache:
        condition: service_healthy
      cache-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
networks:
  front:
    ipam:
      config:
      - subnet: 10.61.10.0/24
        gateway: 10.61.10.1
  back:
    ipam:
      config:
      - subnet: 10.61.20.0/24
        gateway: 10.61.20.1
  access:
    ipam:
      config:
      - subnet: 10.61.99.0/24
        gateway: 10.61.99.1
volumes:
  cache-data: {}
