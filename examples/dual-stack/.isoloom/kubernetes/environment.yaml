apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-dual-stack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: web
  template:
