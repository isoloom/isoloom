# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: vlan-office
services:
  isoloom-router:
    image: alpine:3.20
    hostname: isoloom-router
    cap_add:
    - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
    networks:
      office-vlan10:
        ipv4_address: 10.70.10.254
      office-vlan20:
        ipv4_address: 10.70.20.254
      servers:
        ipv4_address: 10.70.99.254
    environment:
      RULES: |
        table inet isoloom {
          chain forward {
            type filter hook forward priority 0; policy drop;
            ct state established,related accept
            ip saddr 10.70.10.0/24 ip daddr 10.70.99.0/24 meta l4proto { tcp, udp } th dport { 80 } accept
            ip saddr 10.70.10.0/24 ip daddr 10.70.99.0/24 icmp type echo-request accept
          }
        }
    entrypoint:
    - /bin/sh
    - -c
    - apk add --no-cache nftables >/dev/null && printf '%s' "$$RULES" | nft -f - && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - nft list table inet isoloom >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  intranet:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: intranet
    networks:
      servers:
        ipv4_address: 10.70.99.10
    extra_hosts:
    - staff:10.70.10.10
    - guest:10.70.20.10
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  intranet-routes:
    image: alpine:3.20
    network_mode: service:intranet
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.70.10.0/24 via 10.70.99.254 && ip route replace 10.70.20.0/24 via 10.70.99.254 && (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.70.10.0/24 | grep -q via && ! ip route | grep -q '^default'
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      intranet:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
  guest:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: guest
    networks:
      office-vlan20:
        ipv4_address: 10.70.20.10
    extra_hosts:
    - intranet:10.70.99.10
    - staff:10.70.10.10
    restart: unless-stopped
  guest-routes:
    image: alpine:3.20
    network_mode: service:guest
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.70.10.0/24 via 10.70.20.254 && ip route replace 10.70.99.0/24 via 10.70.20.254 && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.70.10.0/24 | grep -q via
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      guest:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
  isoloom-access:
    image: alpine:3.20
    hostname: staff
    networks:
      office-vlan10:
        ipv4_address: 10.70.10.10
    extra_hosts:
    - intranet:10.70.99.10
    - guest:10.70.20.10
    entrypoint:
    - sleep
    - infinity
    profiles:
    - check
  isoloom-access-routes:
    image: alpine:3.20
    network_mode: service:isoloom-access
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - ip route replace 10.70.20.0/24 via 10.70.10.254 && ip route replace 10.70.99.0/24 via 10.70.10.254 && (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.70.20.0/24 | grep -q via && ! ip route | grep -q '^default'
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      isoloom-access:
        condition: service_started
      isoloom-router:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - check
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/staff.sh:/isoloom/run.sh:ro
    network_mode: service:isoloom-access
    depends_on:
      intranet:
        condition: service_healthy
      intranet-routes:
        condition: service_healthy
      guest-routes:
        condition: service_healthy
      isoloom-access:
        condition: service_started
      isoloom-access-routes:
        condition: service_healthy
  isoloom-check-intranet:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/intranet.sh:/isoloom/run.sh:ro
    network_mode: service:intranet
    depends_on:
      intranet:
        condition: service_healthy
      intranet-routes:
        condition: service_healthy
      guest-routes:
        condition: service_healthy
  isoloom-check-guest:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/guest.sh:/isoloom/run.sh:ro
    network_mode: service:guest
    depends_on:
      intranet:
        condition: service_healthy
      intranet-routes:
        condition: service_healthy
      guest-routes:
        condition: service_healthy
      guest:
        condition: service_started
networks:
  office-vlan10:
    ipam:
      config:
      - subnet: 10.70.10.0/24
        gateway: 10.70.10.1
  office-vlan20:
    ipam:
      config:
      - subnet: 10.70.20.0/24
        gateway: 10.70.20.1
  servers:
    ipam:
      config:
      - subnet: 10.70.99.0/24
        gateway: 10.70.99.1
