# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# The checks: `helm test <release>` runs a Job per position (`exec` checks, run inside a machine,
# stay with `isoloom test kubernetes`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: isoloom-check-runners
data:
  staff.sh: {{ .Files.Get "files/checks/staff.sh" | quote }}
  intranet.sh: {{ .Files.Get "files/checks/intranet.sh" | quote }}
  guest.sh: {{ .Files.Get "files/checks/guest.sh" | quote }}
  admin.sh: {{ .Files.Get "files/checks/admin.sh" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: isoloom-check
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        net.isoloom.com/office-vlan10: member
        isoloom.com/check: isoloom-check
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: curlimages/curl:8.11.1
        command:
        - /bin/sh
        - /isoloom/run/staff.sh
        volumeMounts:
        - name: runner
          mountPath: /isoloom/run
      volumes:
      - name: runner
        configMap:
          name: isoloom-check-runners
          defaultMode: 493
---
