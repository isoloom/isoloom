# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# One Windows server with IIS: provisioned in PowerShell over WinRM, its page published on the
# host's loopback. VM targets only (Windows has no container form). The box is pinned
# explicitly (the same one the built-in table uses).
version: 1
name: windows-hello

networks:
  lab: { cidr: 192.168.57.0/24 }

machines:
  web01:
    networks: { lab: 10 }
    services: [{ port: 80, http: true, publish: 8082 }]
    resources: { cpus: 2, memory_mb: 3072 }
    vm:
      os: windows-server-2019
      image:
        vagrant: StefanScherer/windows_2019
        vagrant_version: "2021.05.15"
        qemu: peru/windows-server-2019-standard-x64-eval   # on QEMU (x86 emulated on an Apple Silicon Mac)
        winrm: plaintext
      provision: [provision/iis.ps1]

checks:
  - checks/web01-answers.sh
