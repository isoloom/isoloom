# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: supplier-portal-api
services:
  database:
    image: mysql:8.0
    platform: linux/amd64
    hostname: database
    networks:
      lab:
        ipv4_address: 10.20.0.32
    environment:
      API_URL: ${API_URL:-}
      LAUNCH_TOKEN: ${LAUNCH_TOKEN:-}
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 3207 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/3207' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.service.mysql: tcp:3207
    restart: unless-stopped
  database-init-1:
    image: mysql:8.0
    entrypoint:
    - /bin/sh
    - /isoloom/init/seed.sh
    volumes:
    - ../../build/database/seed.sh:/isoloom/init/seed.sh:ro
    network_mode: service:database
    environment:
      API_URL: ${API_URL:-}
      LAUNCH_TOKEN: ${LAUNCH_TOKEN:-}
    depends_on:
      database:
        condition: service_healthy
    restart: no
  web:
    build:
      context: ../../build/web
    image: isoloom/supplier-portal-api-web
    platform: linux/amd64
    hostname: web
    networks:
      lab:
        ipv4_address: 10.20.0.31
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+3206}:3206
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 3206 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/3206' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
      database-init-1:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.service.portal: http:3206
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - echo '== build/check/check.sh' && sh /isoloom/checks/01-check.sh
    volumes:
    - ../../build/check/check.sh:/isoloom/checks/01-check.sh:ro
    networks:
      lab: null
    depends_on:
      database:
        condition: service_healthy
      database-init-1:
        condition: service_completed_successfully
      web:
        condition: service_healthy
networks:
  lab:
    ipam:
      config:
      - subnet: 10.20.0.0/24
        gateway: 10.20.0.1
