# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: isoloom-supplier-portal-api
resources:
  - environment.yaml
# The project's scripts the pods run (init jobs, checks), read from the project at apply time.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: isoloom-scripts
    files:
      - build__check__check.sh=../../build/check/check.sh
      - build__database__seed.sh=../../build/database/seed.sh
