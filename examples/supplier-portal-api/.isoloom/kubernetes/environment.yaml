#         kubectl -n isoloom-supplier-portal-api wait --for=condition=Available deployment --all --timeout=600s
# Stop:   kubectl delete namespace isoloom-supplier-portal-api
# Images built from the project, before starting (a local cluster sharing Docker's images:
# OrbStack, Docker Desktop; elsewhere, push them to a registry the cluster pulls from):
#   docker build -t isoloom/supplier-portal-api-web build/web
# Inputs (optional, unset ones are empty): kubectl -n isoloom-supplier-portal-api create secret generic isoloom-inputs --from-literal=API_URL=… --from-literal=LAUNCH_TOKEN=…

apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-supplier-portal-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: database
  template:
    metadata:
      labels:
        isoloom.com/machine: database
        net.isoloom.com/lab: member
    spec:
      hostname: database
      containers:
      - name: database
        image: mysql:8.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3207
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - (nc -z 127.0.0.1 3207 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/3207' 2>/dev/null)
          periodSeconds: 5
          failureThreshold: 60
        env:
        - name: API_URL
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: API_URL
              optional: true
        - name: LAUNCH_TOKEN
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: LAUNCH_TOKEN
              optional: true
        resources:
          limits:
            cpu: '1'
            memory: 1024Mi
      - name: init
        image: mysql:8.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until (nc -z 127.0.0.1 3207 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/3207' 2>/dev/null); do sleep 2; done && sh /isoloom/scripts/build__database__seed.sh && exec sleep infinity
        env:
        - name: API_URL
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: API_URL
              optional: true
        - name: LAUNCH_TOKEN
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: LAUNCH_TOKEN
              optional: true
        volumeMounts:
        - name: scripts
          mountPath: /isoloom/scripts
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    isoloom.com/machine: database
  ports:
  - name: p3207
    port: 3207
    targetPort: 3207
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: web
  template:
    metadata:
      labels:
        isoloom.com/machine: web
        net.isoloom.com/lab: member
    spec:
      hostname: web
      initContainers:
      - name: wait-database
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z database 3207; do sleep 2; done
      containers:
      - name: web
        image: isoloom/supplier-portal-api-web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3206
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - (nc -z 127.0.0.1 3206 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/3206' 2>/dev/null)
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '1'
            memory: 1024Mi
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    isoloom.com/machine: web
  ports:
  - name: p3206
    port: 3206
    targetPort: 3206
---
apiVersion: v1
kind: Service
metadata:
  name: web-published
spec:
  type: LoadBalancer
  selector:
    isoloom.com/machine: web
  ports:
  - name: p3206
    port: 3206
    targetPort: 3206
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publish-web
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: web
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 3206
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isoloom-default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: net-lab
spec:
  podSelector:
    matchLabels:
      net.isoloom.com/lab: member
  ingress:
  - from:
    - podSelector:
        matchLabels:
          net.isoloom.com/lab: member
