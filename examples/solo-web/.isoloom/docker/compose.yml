# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: solo-web
services:
  web:
    build:
      context: ../../build/web
    image: isoloom/solo-web-web
    platform: linux/amd64
    hostname: web
    networks:
      app:
        ipv4_address: 10.80.0.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8080}:80
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - echo '== checks/web-answers.sh' && sh /isoloom/checks/01-web-answers.sh
    volumes:
    - ../../checks/web-answers.sh:/isoloom/checks/01-web-answers.sh:ro
    networks:
      app: null
    depends_on:
      web:
        condition: service_healthy
networks:
  app:
    ipam:
      config:
      - subnet: 10.80.0.0/24
        gateway: 10.80.0.1
