# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  kubectl kustomize --load-restrictor LoadRestrictionsNone .isoloom/kubernetes | kubectl apply -f -
#         kubectl -n isoloom-solo-web wait --for=condition=Available deployment --all --timeout=600s
# Stop:   kubectl delete namespace isoloom-solo-web
# Images built from the project, before starting (a local cluster sharing Docker's images:
# OrbStack, Docker Desktop; elsewhere, push them to a registry the cluster pulls from):
#   docker build -t isoloom/solo-web-web build/web

apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-solo-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: web
  template:
    metadata:
      labels:
        isoloom.com/machine: web
        net.isoloom.com/app: member
    spec:
      hostname: web
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: web
        image: isoloom/solo-web-web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
          periodSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: isoloom-probe
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    isoloom.com/machine: web
  ports:
  - name: p80
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-published
spec:
  type: LoadBalancer
  selector:
    isoloom.com/machine: web
  ports:
  - name: p8080
    port: 8080
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publish-web
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: web
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isoloom-default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: net-app
spec:
  podSelector:
    matchLabels:
      net.isoloom.com/app: member
  ingress:
  - from:
    - podSelector:
        matchLabels:
          net.isoloom.com/app: member
