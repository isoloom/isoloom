# `isoloom generate`. `isoloom check` fails when this file is out of date.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: writer
  template:
    metadata:
      labels:
        isoloom.com/machine: writer
        net.isoloom.com/app: member
    spec:
      hostname: writer
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      - name: seed-shared
        image: '{{ index .Values.images "writer" }}'
        imagePullPolicy: IfNotPresent
        command:
        - /.isoloom-probe/busybox
        - sh
        - -c
        - 'd=/isoloom-seed; m="$d/.isoloom-seeding"; b=/.isoloom-probe/busybox; [ -d ''/srv/shared'' ] || exit 0; for f in "$d"/* "$d"/.[!.]* "$d"/..?*; do if [ -e "$f" ] || [ -L "$f" ]; then case "$f" in "$d/lost+found" | "$m") ;; *) [ -e "$m" ] || exit 0; $b rm -rf "$f" ;; esac; fi; done; : > "$m" && $b cp -a ''/srv/shared/.'' "$d/" && $b rm -f "$m"'
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: vol-shared
          mountPath: /isoloom-seed
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      containers:
      - name: writer
        image: '{{ index .Values.images "writer" }}'
        imagePullPolicy: IfNotPresent
        command:
        - sleep
        - infinity
        volumeMounts:
        - name: vol-shared
          mountPath: /srv/shared
        - name: disk-data
          mountPath: /srv/data
      - name: init
        image: '{{ index .Values.images "writer" }}'
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - sh /isoloom/scripts/steps__write.sh && exec sleep infinity
        volumeMounts:
        - name: vol-shared
          mountPath: /srv/shared
        - name: disk-data
          mountPath: /srv/data
        - name: scripts
          mountPath: /isoloom/scripts
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: vol-shared
        persistentVolumeClaim:
          claimName: shared
      - name: disk-data
        persistentVolumeClaim:
          claimName: writer-data
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
      - name: isoloom-probe
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: writer-data
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
