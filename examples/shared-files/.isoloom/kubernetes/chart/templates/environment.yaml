spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: reader
  template:
    metadata:
      labels:
        isoloom.com/machine: reader
        net.isoloom.com/app: member
    spec:
      hostname: reader
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                isoloom.com/machine: writer
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: reader
        image: '{{ index .Values.images "reader" }}'
        imagePullPolicy: IfNotPresent
        command:
        - sleep
        - infinity
        volumeMounts:
        - name: vol-shared
          mountPath: /data/shared
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: vol-shared
        persistentVolumeClaim:
          claimName: shared
      - name: isoloom-probe
        emptyDir: {}
