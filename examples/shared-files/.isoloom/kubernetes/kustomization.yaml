# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# The project's scripts the pods run (init jobs, checks), read from the project at apply time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: isoloom-shared-files
resources:
- environment.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: isoloom-scripts
  files:
  - steps__write.sh=../../steps/write.sh
