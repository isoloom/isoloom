name: shared-files
services:
  writer:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: writer
    networks:
      app:
        ipv4_address: 10.84.0.10
    volumes:
    - shared:/srv/shared
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: shared-files
  writer-init-1:
    image: alpine:3.20
    entrypoint:
    - /bin/sh
    - /isoloom/init/write.sh
    volumes:
    - ../../steps/write.sh:/isoloom/init/write.sh:ro
    - shared:/srv/shared
    network_mode: service:writer
    depends_on:
      writer:
        condition: service_started
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: shared-files
  reader:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: reader
    networks:
      app:
        ipv4_address: 10.84.0.11
    volumes:
    - shared:/data/shared
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: shared-files
  isoloom-check-reader:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/reader.sh:/isoloom/run.sh:ro
    network_mode: service:reader
    depends_on:
      writer-init-1:
        condition: service_completed_successfully
      reader:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: shared-files
networks:
  app:
    ipam:
      config:
      - subnet: 10.84.0.0/24
        gateway: 10.84.0.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: shared-files
volumes:
  shared:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: shared-files
