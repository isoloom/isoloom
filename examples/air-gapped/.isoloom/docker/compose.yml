# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v
# On Docker, network `lab` uses 10.62.0.0/24 instead of 192.168.62.0/24 (same last octets).

name: air-gapped
services:
  store:
    image: redis:7-alpine
    platform: linux/amd64
    hostname: store
    networks:
      lab:
        ipv4_address: 10.62.0.20
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 6379 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/6379' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    labels:
      isoloom.service.redis: tcp:6379
    restart: unless-stopped
  app:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: app
    networks:
      lab:
        ipv4_address: 10.62.0.10
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      store:
        condition: service_healthy
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - echo '== checks/app-answers.sh' && sh /isoloom/checks/01-app-answers.sh && echo '== checks/no-internet.sh' && sh /isoloom/checks/02-no-internet.sh
    volumes:
    - ../../checks/app-answers.sh:/isoloom/checks/01-app-answers.sh:ro
    - ../../checks/no-internet.sh:/isoloom/checks/02-no-internet.sh:ro
    networks:
      lab: null
    depends_on:
      store:
        condition: service_healthy
      app:
        condition: service_healthy
networks:
  lab:
    ipam:
      config:
      - subnet: 10.62.0.0/24
        gateway: 10.62.0.1
    internal: true
