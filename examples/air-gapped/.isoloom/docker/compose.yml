# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v
# On Docker, network `lab` uses 10.62.0.0/24 instead of 192.168.62.0/24 (same last octets).

name: air-gapped
services:
  store:
    image: redis:7-alpine
    platform: linux/amd64
    hostname: store
    networks:
      lab:
        ipv4_address: 10.62.0.20
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 6379
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.redis: tcp:6379
    restart: unless-stopped
  app:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: app
    networks:
      lab:
        ipv4_address: 10.62.0.10
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      store:
        condition: service_healthy
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  isoloom-check-store:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/store.sh:/isoloom/run.sh:ro
    network_mode: service:store
    depends_on:
      store:
        condition: service_healthy
      app:
        condition: service_healthy
  isoloom-check-app:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/app.sh:/isoloom/run.sh:ro
    network_mode: service:app
    depends_on:
      store:
        condition: service_healthy
      app:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.62.0.0/24
        gateway: 10.62.0.1
    internal: true
volumes:
  isoloom-probe-amd64: {}
