# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# The checks: `helm test <release>` runs a Job per position (`exec` checks, run inside a machine,
# stay with `isoloom test kubernetes`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: isoloom-check-runners
binaryData:
  store.sh: '{{ .Files.Get "files/checks/store.sh" | b64enc }}'
  app.sh: '{{ .Files.Get "files/checks/app.sh" | b64enc }}'
---
apiVersion: v1
kind: Pod
metadata:
  name: isoloom-check-store
  labels:
    net.isoloom.com/lab: member
    isoloom.com/check: isoloom-check-store
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
  - name: check
    image: curlimages/curl:8.11.1
    command:
    - /bin/sh
    - /isoloom/run/store.sh
    volumeMounts:
    - name: runner
      mountPath: /isoloom/run
  volumes:
  - name: runner
    configMap:
      name: isoloom-check-runners
      defaultMode: 493
---
apiVersion: v1
kind: Pod
metadata:
  name: isoloom-check-app
  labels:
    net.isoloom.com/lab: member
    isoloom.com/check: isoloom-check-app
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
  - name: check
    image: curlimages/curl:8.11.1
    command:
    - /bin/sh
    - /isoloom/run/app.sh
    volumeMounts:
    - name: runner
      mountPath: /isoloom/run
  volumes:
  - name: runner
    configMap:
      name: isoloom-check-runners
      defaultMode: 493
