# Start:  kubectl kustomize --load-restrictor LoadRestrictionsNone .isoloom/kubernetes | kubectl apply -f -
#         kubectl -n isoloom-air-gapped wait --for=condition=Available deployment --all --timeout=600s
# Stop:   kubectl delete namespace isoloom-air-gapped

apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-air-gapped
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: store
  template:
    metadata:
      labels:
        isoloom.com/machine: store
        net.isoloom.com/lab: on
    spec:
      hostname: store
      containers:
      - name: store
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - (nc -z 127.0.0.1 6379 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/6379' 2>/dev/null)
          periodSeconds: 5
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: store
spec:
  selector:
    isoloom.com/machine: store
  ports:
  - name: p6379
    port: 6379
    targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offline-store
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: store
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: app
  template:
    metadata:
      labels:
        isoloom.com/machine: app
        net.isoloom.com/lab: on
    spec:
      hostname: app
      initContainers:
      - name: wait-store
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z store 6379; do sleep 2; done
      containers:
      - name: app
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
          periodSeconds: 5
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    isoloom.com/machine: app
  ports:
  - name: p80
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offline-app
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: app
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isoloom-default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: net-lab
spec:
  podSelector:
    matchLabels:
      net.isoloom.com/lab: on
  ingress:
  - from:
    - podSelector:
        matchLabels:
          net.isoloom.com/lab: on
