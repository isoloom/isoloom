# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# A machine to work from, next to a web server: the workbench is its OS alone, Alpine, so its
# container is Alpine's own image kept running with no service of its own. Exec into it and reach
# web:80 from there.
version: 1
name: workbench

networks:
  lan: { cidr: 10.90.0.0/24 }

machines:
  bench:
    os: alpine
    networks: { lan: 10 }
  web:
    networks: { lan: 11 }
    ports: { web: { port: 80, protocol: http } }
    app: { image: "nginx:1.27-alpine" }
