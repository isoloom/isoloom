# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: workbench
services:
  bench:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: bench
    networks:
      lan:
        ipv4_address: 10.90.0.10
    labels:
      isoloom.managed: 'true'
      isoloom.environment: workbench
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: web
    networks:
      lan:
        ipv4_address: 10.90.0.11
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.service.80: http:80
      isoloom.managed: 'true'
      isoloom.environment: workbench
    restart: unless-stopped
  isoloom-check-bench:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:bench
    volumes:
    - ./checks/bench.sh:/isoloom/run.sh:ro
    depends_on:
      web:
        condition: service_healthy
      bench:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: workbench
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    network_mode: none
    volumes:
    - isoloom-probe-amd64:/probe
    labels:
      isoloom.managed: 'true'
      isoloom.environment: workbench
    restart: no
networks:
  lan:
    ipam:
      config:
      - subnet: 10.90.0.0/24
        gateway: 10.90.0.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: workbench
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: workbench
