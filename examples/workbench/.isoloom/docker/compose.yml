# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: workbench
services:
  bench:
    image: alpine:3.20
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: bench
    networks:
      lan:
        ipv4_address: 10.90.0.10
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    platform: linux/amd64
    hostname: web
    networks:
      lan:
        ipv4_address: 10.90.0.11
    healthcheck:
      test:
      - CMD-SHELL
      - (nc -z 127.0.0.1 80 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/80' 2>/dev/null)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    labels:
      isoloom.service.80: http:80
    restart: unless-stopped
  isoloom-check-bench:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/bench.sh:/isoloom/run.sh:ro
    network_mode: service:bench
    depends_on:
      web:
        condition: service_healthy
      bench:
        condition: service_started
networks:
  lan:
    ipam:
      config:
      - subnet: 10.90.0.0/24
        gateway: 10.90.0.1
