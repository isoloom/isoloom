# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: private-names
services:
  web:
    image: nginx:1.27
    platform: linux/amd64
    hostname: web
    networks:
      office:
        ipv4_address: 10.84.0.10
        aliases:
        - www
        - web.corp.internal
        - www.corp.internal
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    labels:
      isoloom.port.80: http:80
      isoloom.managed: 'true'
      isoloom.environment: private-names
    restart: unless-stopped
  client:
    image: debian:12-slim
    platform: linux/amd64
    entrypoint:
    - sleep
    - infinity
    hostname: client
    networks:
      office:
        ipv4_address: 10.84.0.20
        aliases:
        - client.corp.internal
    labels:
      isoloom.managed: 'true'
      isoloom.environment: private-names
    restart: unless-stopped
  isoloom-check-web:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:web
    volumes:
    - ./checks/web.sh:/isoloom/run.sh:ro
    depends_on:
      web:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: private-names
  isoloom-check-client:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:client
    volumes:
    - ./checks/client.sh:/isoloom/run.sh:ro
    depends_on:
      web:
        condition: service_healthy
      client:
        condition: service_started
    labels:
      isoloom.managed: 'true'
      isoloom.environment: private-names
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    network_mode: none
    volumes:
    - isoloom-probe-amd64:/probe
    labels:
      isoloom.managed: 'true'
      isoloom.environment: private-names
    restart: no
networks:
  office:
    ipam:
      config:
      - subnet: 10.84.0.0/24
        gateway: 10.84.0.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: private-names
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: private-names
