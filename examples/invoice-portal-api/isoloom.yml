# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# An invoice portal API in the shape of a CTF lab: a read-only API on a fixed host port, its
# database behind it, and two values given at launch. The launch token reaches the database as a
# file, never as an environment variable; the API's URL isn't secret, so it is one. One spec runs
# as containers or as one Debian 12 VM per machine.
version: 1
name: invoice-portal-api

networks:
  lab: { cidr: 10.20.0.0/24 }

# Given at launch. Without them (a local run, CI) the database seeds its development amount.
inputs:
  CTF_API_URL: { sensitive: false, description: "The API a launcher would claim the player's evidence from." }
  CTF_LAUNCH_TOKEN: { description: "A single-use token given at launch; the database's setup derives the invoice amount from it." }

machines:
  database:
    os: debian@12
    networks: { lab: 32 }
    ports: { mysql: 3207 }
    resources: { cpus: 1, memory_mb: 1024 }
    environment:
      CTF_API_URL: { input: CTF_API_URL }
    files:
      - { path: /run/lab/launch-token, input: CTF_LAUNCH_TOKEN }
    # The placed amount: it must survive a restart, as a single-use token can't be read twice.
    volumes: { evidence: /var/lib/ctf }
    # A recipe per form: an image built from mysql:8.0 on containers, MariaDB on a Debian VM.
    app:
      build: build/database
      steps: [{ run: provision/database.sh }]
    # Once the database answers: place the amount of invoice INV-1042, on every target alike.
    setup: [build/database/evidence.sh]

  web:
    os: debian@12
    networks: { lab: 31 }
    ports:
      # The API's documentation names localhost:8080, so the host port is fixed, and
      # non-privileged, so a VM forwards it without admin rights.
      portal: { port: 80, protocol: http, publish: { host: 8080, fixed: true } }
    depends_on: [database]
    resources: { cpus: 1, memory_mb: 1024 }
    app:
      build: build/web
      steps: [{ run: provision/web.sh }]

# The lesson, declared (the API refuses a request without its key), and the intended path, as a
# script that sends the documented key.
checks:
  - name: the API refuses a request without its key
    http: http://web/api/invoices/INV-1042
    expect: 401
  - build/check/check.sh

message: |
  The invoice portal API answers at {{ machines.web.ports.portal.url }}.
  Its documentation is on its home page; the invoice to look up is INV-1042.
