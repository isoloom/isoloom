recipe:
  install:
    - packages: [ca-certificates, xz-utils]
      when: { family: [debian, ubuntu] }
    - packages: [ca-certificates, xz]
      when: { family: [rocky] }
    - file: { path: /var/cache/isoloom/node.tar.xz, url: "{{ vars.url }}", sha256: "{{ vars.sha256 }}" }
    - command: "tar -xJf /var/cache/isoloom/node.tar.xz --strip-components=1 --no-same-owner -C /usr/local"
      creates: /usr/local/bin/node
    - group: { name: node }
    - user: { name: node, group: node, home: /home/node, shell: /bin/bash }

  configure: []
  start: []
