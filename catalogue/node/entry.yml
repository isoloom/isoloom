# yaml-language-server: $schema=../entry.schema.json
#
# The node entry: Node.js, as the official node image has it (node, npm and npx under /usr/local,
# a `node` user), for a machine whose app runs on Node: nodejs.org's build of the exact release,
# pinned by the SHA-256 its release's SHASUMS256.txt lists. The image's interactive shell is its
# command: there is no service, the app's own command runs. lock.yml beside it is written only by
# `cargo xtask catalogue refresh node`.
name: node
description: >-
  Node.js of an exact release, with npm and npx, installed the way the official node image has
  it (under /usr/local, a `node` user): the runtime an app's own command runs on.
upstream: https://nodejs.org/
licence:
  software: MIT
  notes: The release bundles its dependencies under their own licences.

