# yaml-language-server: $schema=../contract.schema.json
#
# What mariadb does, proven on the container form (the official image). `cargo xtask catalogue
# check mariadb` builds a small lab (`web`, an access machine `probe`) and runs it on `docker`
# through the Isothrum CLI. The exec probes run as root in the container, which the image's
# unix-socket plugin authenticates.
cases:
  default:
    with: { password: "root-secret", user_password: "app-secret" }

checks:
  - name: the port answers
    tcp: "{{ machine }}:3306"
    wait: 2m
  - name: mariadb reports the release asked for
    exec: mariadbd --version
    expect: "{{ version }}"
  - name: the server answers a ping
    exec: mariadb-admin -uroot -p"{{ with.password }}" ping 2>&1
    expect: "mysqld is alive"
  - name: the application database exists
    exec: mariadb -uroot -p"{{ with.password }}" -N -B -e "show databases like '{{ with.database }}'"
    expect: "{{ with.database }}"

facts:
  - name: the server version
    exec: mariadbd --version
