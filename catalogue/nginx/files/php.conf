# SPDX-License-Identifier: Apache-2.0
# Written by Isoloom from the catalogue's nginx entry when `with.php_fpm` is set. The php-fpm
# machine keeps its own copy of the site at /var/www/html (the php-fpm entry's `root`), so the
# script's path is the one it has there. `fastcgi_pass` is that machine's address and port.
location ~ \.php$ {
    try_files     $uri =404;
    fastcgi_pass  {{ with.php_fpm }};
    fastcgi_index index.php;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
}
