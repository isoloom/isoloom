# yaml-language-server: $schema=../contract.schema.json
#
# What mongodb does, proven on the container form (the official image). `cargo xtask catalogue
# check mongodb` builds a small lab (`web`, an access machine `probe`) and runs it on `docker`
# through the Isothrum CLI.
cases:
  default: {}

checks:
  - name: the port answers
    tcp: "{{ machine }}:27017"
    wait: 2m
  - name: mongodb reports the release asked for
    exec: mongod --version
    expect: "v{{ version }}."
  - name: the server answers a ping
    exec: mongosh --quiet --eval 'db.runCommand({ping:1}).ok'
    expect: "1"

facts:
  - name: the server version
    exec: mongod --version
