; SPDX-License-Identifier: Apache-2.0
; Written by Isoloom from the catalogue's php-fpm entry, the same in every form. It replaces the
; OS package's default pool so php-fpm listens on a TCP port a web machine on the lab network can
; reach, in place of the Unix socket the package listens on by default.
[www]
user = www-data
group = www-data
listen = 0.0.0.0:{{ with.port }}
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
