; SPDX-License-Identifier: Apache-2.0
; Written by Isoloom from the catalogue's php entry: the php-fpm image's pool, on TCP port 9000 as
; the image's, its workers as www-data, their output kept.
[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
