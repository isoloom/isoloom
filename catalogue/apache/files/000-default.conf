# SPDX-License-Identifier: Apache-2.0
# Written by Isoloom from the catalogue's apache entry, the same in every form. The single virtual
# host that serves /var/www/html on the configured port. `with: { root: <folder> }` fills
# /var/www/html with a folder of the project.
<VirtualHost *:{{ with.port }}>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
